name: Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # Secret Scanning
  # ============================================================================
  # SECURITY (2026-07-26 counter-audit, closes finding L-1 from
  # docs/SECURITY_REVIEW_2026-07-02_RECURRENCE_RISK.md): the 2026-06-22
  # incident post-mortem's own root cause was a private key pasted into a
  # markdown handover file. No mechanical control existed to catch that class
  # of mistake before this job — the only prior check was a narrow,
  # non-failing grep in the `crypto-security` job below (`.rs` files only,
  # `continue-on-error` implicit via `if`, never blocks a merge). `gitleaks`
  # scans the full diff (`push`/`pull_request`) for high-entropy strings and
  # known secret patterns (private keys, API tokens, connection strings)
  # across every file type, and FAILS the job on a match — this is a
  # required check, not an advisory warning.
  secrets-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ============================================================================
  # Dependency Audit
  # ============================================================================
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        # Known/unreachable transitive advisories are explicitly allow-listed
        # in .cargo/audit.toml (each with a justification). Any advisory NOT
        # in that list — i.e. any new vulnerability — fails this job.
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo deny
        run: cargo deny check
        continue-on-error: true  # Don't fail the build, just report

  # ============================================================================
  # SAST (Static Application Security Testing)
  # ============================================================================
  sast:
    name: Static Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run security-focused Clippy lints
        run: |
          cargo clippy --workspace --all-features -- \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic \
            -W clippy::todo \
            -W clippy::unimplemented \
            -W clippy::unreachable \
            -D clippy::mem_forget

  # ============================================================================
  # Cryptographic Implementation Checks
  # ============================================================================
  crypto-security:
    name: Cryptographic Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check for weak crypto patterns
        run: |
          # Search for potentially weak cryptographic patterns
          echo "Checking for weak crypto patterns..."

          # Check for use of MD5 or SHA1 for security purposes
          if grep -r "md5\|sha1" --include="*.rs" crates/ | grep -v "test\|example\|comment"; then
            echo "Warning: Found potential use of weak hash algorithms"
          fi

          # Check for hardcoded secrets
          if grep -rE "(password|secret|key)\s*=\s*\"[^\"]+\"" --include="*.rs" crates/ | grep -v "test\|example"; then
            echo "Warning: Found potential hardcoded secrets"
          fi

          echo "Crypto security checks completed"

      - name: Run rope-crypto tests with address sanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -p rope-crypto --target x86_64-unknown-linux-gnu
        continue-on-error: true  # ASAN may not be available on all systems

  # ============================================================================
  # Fuzzing (optional, runs on schedule)
  # ============================================================================
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzzing for 5 minutes
        run: |
          cd crates/rope-crypto
          cargo +nightly fuzz run fuzz_hybrid_sign -- -max_total_time=300
        continue-on-error: true

  # ============================================================================
  # License Compliance
  # ============================================================================
  license:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-license
        run: cargo install cargo-license

      - name: Check licenses
        run: |
          cargo license --json > licenses.json
          # Check for copyleft licenses that might be incompatible
          if grep -E "GPL|AGPL|LGPL" licenses.json; then
            echo "Warning: Found copyleft licenses in dependencies"
          fi
