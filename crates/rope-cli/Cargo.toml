[package]
name = "rope-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for Datachain Rope"

[[bin]]
name = "rope"
path = "src/main.rs"

[dependencies]
rope-node = { path = "../rope-node" }
rope-core = { path = "../rope-core" }
rope-crypto = { path = "../rope-crypto" }
rope-deployer = { path = "../rope-deployer" }

tokio = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
libp2p = { workspace = true }
reqwest = { version = "0.11", features = ["json"] }
dirs = "5.0"
rustc_version_runtime = "0.3"

# Identity + governance signing (added 2026-05-03)
ed25519-dalek = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

# Optional: tokio-console subscriber for diagnosing the recurring async deadlock
# in rope-node under memory pressure. Build with:
#   RUSTFLAGS="--cfg tokio_unstable" cargo build --profile release-debug -p rope-cli --features tokio-console
console-subscriber = { version = "0.4", optional = true }

[features]
default = []
tokio-console = ["console-subscriber"]
