[package]
name = "rope-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for Datachain Rope"

[[bin]]
name = "rope"
path = "src/main.rs"

[dependencies]
rope-node = { path = "../rope-node" }
rope-consensus = { path = "../rope-consensus" }
rope-core = { path = "../rope-core" }
rope-crypto = { path = "../rope-crypto" }
rope-deployer = { path = "../rope-deployer" }

tokio = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
libp2p = { workspace = true }
reqwest = { version = "0.11", features = ["json"] }
dirs = "5.0"
rustc_version_runtime = "0.3"

# Identity + governance signing (added 2026-05-03)
ed25519-dalek = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

# Non-custodial EVM wallet keygen for `rope wallet new` (added 2026-07-23)
k256 = { workspace = true }
sha3 = { workspace = true }
