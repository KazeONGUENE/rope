[package]
name = "rope-cluster"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Quipu Canon v2.0 Phase 2.D — horizontal node sharding for Datachain Rope"

[dependencies]
rope-core = { path = "../rope-core" }

# Serialization
serde = { workspace = true }
serde_bytes = "0.11"
bincode = { workspace = true }

# Sync primitives
parking_lot = { workspace = true }
once_cell = { workspace = true }

# Hashing for partition assignment
blake3 = { workspace = true }

# Async runtime (for the remote-endpoint trait, even if the in-proc impl is sync)
tokio = { workspace = true }
async-trait = { workspace = true }

# Errors / logging
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# Utilities
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }
rope-storage = { path = "../rope-storage" }
