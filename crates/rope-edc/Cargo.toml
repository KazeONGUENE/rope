[package]
name = "rope-edc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ecosystem Deployment Console — self-service sovereign infrastructure for predictive maintenance and environmental monitoring on Datachain Rope"

[[bin]]
name = "rope-edc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
rope-deployer = { path = "../rope-deployer" }
rope-agent-runtime = { path = "../rope-agent-runtime" }

tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
k256 = { workspace = true }
sha3 = { workspace = true }

axum = { version = "0.7", features = ["macros", "tokio"] }
async-graphql = "7"
async-graphql-axum = "7"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "fs"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
futures = "0.3"

[dev-dependencies]
tempfile = "3.0"
tokio = { workspace = true, features = ["test-util"] }
