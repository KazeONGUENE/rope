[package]
name = "rope-idp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Datachain ID — ecosystem identity gateway. Verifies Datawallet+ credentials (Supabase GoTrue) and EIP-191 wallet signatures, and mints Ed25519-signed ecosystem JWTs consumable by every Datachain Rope platform via JWKS."

[[bin]]
name = "rope-idp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
ed25519-dalek = { workspace = true }
k256 = { workspace = true }
sha3 = { workspace = true }

axum = { version = "0.7", features = ["macros", "tokio"] }
