[package]
name = "rope-loadgen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Quipu Canon v2.0 in-process load generator for LedgerStore / LedgerManager throughput, latency, and recovery measurement (spec §10.1)"

[dependencies]
# In-process targets we benchmark
rope-storage = { path = "../rope-storage" }

# CLI + serialization
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Latency capture
hdrhistogram = "7.5"

# Concurrency primitives + RNG
parking_lot = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "rope-loadgen"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }
