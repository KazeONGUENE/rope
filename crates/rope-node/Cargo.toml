[package]
name = "rope-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Datachain Rope node implementation"

[dependencies]
rope-core = { path = "../rope-core" }
rope-crypto = { path = "../rope-crypto" }
rope-consensus = { path = "../rope-consensus" }
rope-network = { path = "../rope-network" }
rope-storage = { path = "../rope-storage" }
rope-protocols = { path = "../rope-protocols" }
rope-smartchain = { path = "../rope-smartchain" }
rope-bridge = { path = "../rope-bridge" }
rope-iot-gateway = { path = "../rope-iot-gateway" }
rope-ai-framework = { path = "../rope-ai-framework" }
# CERBER WATCH capability (2026-07-25 security audit remediation): request
# guard (input validation, blocked signers/IPs) and boot-time
# dispatcher-completeness check. See src/build.rs + rpc_auth.rs.
rope-security = { path = "../rope-security" }

tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
blake3 = { workspace = true }
hashbrown = { workspace = true }
# Phase 1.6 — serialise RopeString blobs into the persistent LedgerStore
bincode = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }

# Networking
libp2p = { workspace = true }

# Metrics
prometheus = { workspace = true }

# HTTP client for Anvil backend
reqwest = { workspace = true }

# WebSocket support — server-side framing (rope-node's own WS listener)
sha1 = "0.10"
base64 = "0.22"

# WebSocket client — used by ws_subscription_bridge.rs to open a
# per-client-connection upstream WSS session to Reth's `--ws` port
# (ws://127.0.0.1:8547 by default) so `eth_subscribe`/`eth_unsubscribe`
# and the server-initiated `eth_subscription` push notifications work
# end-to-end on `wss://ws.datachain.network` / `wss://ws.rope.network`.
# No TLS features requested: the upstream hop is always loopback
# plaintext to a co-located Reth process. Version pin matches
# rope-agent-runtime for workspace consistency.
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Master-node governance signature verification (added 2026-05-03)
ed25519-dalek = { workspace = true }
# Phase-2 V11 closure: signed-payload destructive-RPC verifier.
# secp256k1 ECDSA-with-recovery for wallet-owned methods + keccak256 for
# EIP-191 personal_sign wrapping. See rope-node/src/rpc_signature.rs.
k256 = { workspace = true }
sha3 = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
# Used by build.rs's dispatcher-completeness source scan (CERBER new
# capability, 2026-07-25 audit §5.1) to extract every "rope_*"/"eth_*"/etc
# match-arm literal straight out of rpc_server.rs's own source text.
regex = "1.10"

[dev-dependencies]
tempfile = { workspace = true }
