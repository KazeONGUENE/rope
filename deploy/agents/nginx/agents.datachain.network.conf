# /etc/nginx/sites-available/agents.datachain.network.conf
# Reverse proxy for the two Datachain Rope canonical AI agents that
# expose HTTP listeners. The other three (oracle, validation, insurance)
# are outbound-only and have no public surface here — their state is
# observable on dcscan.io/agents and on-chain via DCScan.
#
# Both endpoints reuse the existing *.datachain.network wildcard cert.

# ───────────────────────────── SemanticAgent ─────────────────────────────
upstream semantic_agent_upstream {
    server 127.0.0.1:9092 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name semantic-agent.datachain.network;

    ssl_certificate     /etc/letsencrypt/live/datachain.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datachain.network/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # CORS — open for read-only search; the agent itself is read-only.
    add_header Access-Control-Allow-Origin  "*"          always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type" always;

    location = /healthz {
        access_log off;
        proxy_pass http://semantic_agent_upstream;
    }

    location / {
        proxy_pass http://semantic_agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     30s;

        # Modest rate limit applied at the http {} block — see datachain.network.conf.
        limit_req zone=public_api burst=20 nodelay;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name semantic-agent.datachain.network;
    return 301 https://$host$request_uri;
}

# ──────────────────────────── ComplianceAgent ────────────────────────────
upstream compliance_agent_upstream {
    server 127.0.0.1:9091 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name compliance-agent.datachain.network;

    ssl_certificate     /etc/letsencrypt/live/datachain.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datachain.network/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # GDPR Article 17 endpoint accepts POST with structured payload + signed
    # requestor proof. CORS is intentionally narrow — only POST + content-type.
    add_header Access-Control-Allow-Origin  "*"            always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type" always;

    # Hard cap on Article 17 request body — agent already enforces a smaller
    # limit, this is a defence-in-depth at the edge.
    client_max_body_size 32k;

    location = /healthz {
        access_log off;
        proxy_pass http://compliance_agent_upstream;
    }

    location / {
        proxy_pass http://compliance_agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout  5s;
        proxy_read_timeout     60s;       # Art. 17 untieKnot is multi-step
        proxy_send_timeout     30s;

        # Tight rate limit — Article 17 endpoint should not see flood traffic.
        limit_req zone=public_api burst=5 nodelay;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name compliance-agent.datachain.network;
    return 301 https://$host$request_uri;
}

# Note — the public_api rate-limit zone must be declared once at the http{}
# level (in nginx.conf or sites-available/datachain.network.conf):
#
#   limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
