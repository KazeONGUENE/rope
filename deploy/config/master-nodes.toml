# Datachain Rope — Master Nodes & Founder Authority Registry
#
# This file is the canonical source of truth for the Datachain Rope mainnet
# (chainId 271828) master-node ACL. It is consumed by `rope-node` at startup
# via `[governance]` in `rope-production.toml` (and `rope-witness.toml`).
#
# Authoritative copy lives in this repo and is rsync'd to every production
# node at /home/ubuntu/datachain-rope/deploy/config/master-nodes.toml.
#
# === Authorization model (v1, 2026-05-03) ===
#
# 1. The 4 RPC slots (BLUE, GREEN, rpc-1, rpc-2) are MASTER NODES.
# 2. The 2 witness nodes (val-1, val-2) are member nodes (not master).
# 3. The Datachain founder identity (Kazé Alphonse Onguene, Datachain
#    Foundation) holds the highest authority. A request signed by any key
#    listed in `founder_keys` OR originating from an email under
#    `founder_domains` (when verified via Datawallet+ ONCHAINID claims) is
#    authorized to perform any governance action.
# 4. A master node's key can perform suspend/isolate but NOT erase. Erase
#    requires a founder signature.
# 5. Governance actions:
#      - rope_suspendNode  : master OR founder
#      - rope_isolateNode  : founder only
#      - rope_eraseNode    : founder only
#
# === Master nodes (chainId 271828) ===

