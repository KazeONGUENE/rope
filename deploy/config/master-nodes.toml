# === Founder authority ===
#
# Whitelisted email/identity domains. A request whose Datawallet+
# ONCHAINID claim resolves to an email under one of these domains is
# treated as a founder-level action.
#
# When the CLI submits a governance action, the user's `rope identity`
# CLI either:
#   (a) uses a locally generated founder key present in `founder_keys`, OR
#   (b) presents an ONCHAINID claim signed by a trusted issuer for
#       an email under `founder_domains`.

[founder]
name = "Kazé Alphonse Onguene"
organization = "Datachain Foundation"
canonical_email = "kaze.onguene@datachain.one"
local_part_aliases = ["kaze.onguene", "kaze", "k"]
domains = [
    "datachain.one",
    "epigraam.com",
    "onguene.com",
    "braincities.co",
]

# Ed25519 public keys (32 bytes hex, no 0x prefix) recognized as founder
# authority. Populate via:
#     rope identity init-founder --output ~/.rope/founder.key
#     # then add the printed pubkey here and rsync the file to all nodes.
# Multiple keys are allowed (laptop + airgapped backup + cold key, etc.).
founder_keys = [
    # ==================================================================
    # Rotated 2026-07-01T11:20Z during 2026-06-22 incident response.
    #
    # PREVIOUS KEY (REVOKED at this timestamp — no longer recognised as
    # founder authority anywhere on Datachain Rope):
    #   eed9f8f6fa68d6272fb81229ca311bd0836e38a188d433253adb2d503564a2e3
    #
    # Reason for revocation: precautionary rotation because the workspace
    # Mac from which the deployer secp256k1 key leaked (see
    # docs/INCIDENT_2026-06-22_FOUNDATION_TREASURY_DRAIN.md) may have
    # also held the founder key material or its filesystem-adjacent
    # artefacts. Rotating removes any residual risk.
    #
    # New key generated 2026-07-01T10:25Z on an offline MacBook Pro
    # (never used for workspace files, never signed into workspace
    # Cursor / iCloud sync), via OpenSSL 3.6.0 openssl-genpkey Ed25519.
    # Private key held encrypted on USB (AES-256-CBC + PBKDF2 600K iter)
    # + paper backup at separate physical location. Cleartext PEM
    # shredded from the offline machine after backup.
    # ==================================================================
    "0e6aa71f8e8161ec7448eca9b04f2e2205b4ef8783810f66cc5c94e4292a77ef",
]

# Additional Datawallet+ DID/ONCHAINID identifiers recognized as founder
# (resolved via Datawallet+ claim issuer if/when integration lands).
founder_dids = [
    "did:datachain:0x6A74c57C3A1EE72D9d2cA29462fbD6fc8fE86bd2",  # DeployerONCHAINID (per handover)
]

# === Replay protection ===
#
# Governance action signatures must include a UTC timestamp within
# `replay_window_secs` of now, plus a unique nonce that the node tracks
# in its rope_governance_log to prevent replay.

[replay]
window_secs = 300  # ±5 minutes
