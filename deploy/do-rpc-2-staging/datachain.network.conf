# datachain.network — DO-rpc-2 failover mirror
#
# Deploy path on DO-rpc-2 (167.172.106.174):
#     /etc/nginx/conf.d/datachain.network.conf
#
# Purpose:
#   When BLUE (rope-vps 92.243.26.189) is degraded AND the DNS failover
#   watcher on DO-rpc-1 promotes `erpc.datachain.network` to a DO node,
#   DO-rpc-2 must be able to serve public RPC traffic identically to
#   DO-rpc-1. Prior to this drop DO-rpc-2 had NO nginx vhost of any
#   kind — every DNS-failover-eligible attester needs a full public
#   surface so the operator can decide at DNS-flip time which DO node
#   takes over.
#
# References:
#   - §13 "erpc.rope.network failover on DO-rpc-1" (recipe this mirrors)
#   - §15 "ws.datachain.network 90 s handshake timeout" (V11 posture)
#   - §16 "dcscan 504 + fleet-status stub" (503 failover-marker JSON)
#   - datachain-rope/deploy/nginx/conf.d/datachain.network.conf (BLUE)
#   - deploy/do-rpc-2-staging/RUNBOOK.md (full deploy sequence)
#
# What DO-rpc-2 does NOT serve:
#   - /v1/fleet-status* (returns 503 stub — fleet-status is BLUE-single-source)
#   - /v1/cerber/mesh-status (mesh peer runs only on BLUE + DCSwap + Tanastok)
#   - dcscan.io (single-A record on BLUE; no failover)
#   - /v1/registry/* (rope-explorer serves this; DO-rpc-2 runs no explorer)
#
# H8 (2026-07-25 audit): HSTS + rate limits are mandatory on every
# public nginx vhost. Defined at the http { } level so every server
# block below picks them up without extra config.

# Rate-limit zones — mirror BLUE's names so operators reading multiple
# nginx configs across the fleet see the same identifiers.
limit_req_zone $binary_remote_addr zone=rpc:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# ------------------------------------------------------------------
# Upstreams
# ------------------------------------------------------------------

# Local rope-node primary + BLUE + DO-rpc-1 as backups. Order matters:
# nginx tries `server` entries in declared order for each new request
# unless `backup` is set (backups are only used when non-backup servers
# fail). We list the local rope-node first because DO-rpc-2 is only
# ever seeing this traffic under DNS failover (i.e. BLUE is already
# degraded from the outside world's view), so serving locally is the
# whole point.
upstream rope_rpc_edge {
    server 127.0.0.1:8545 max_fails=3 fail_timeout=15s;
    server 92.243.26.189:8545 backup max_fails=2 fail_timeout=30s;
    server 157.230.18.45:8545 backup max_fails=2 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 500;
    keepalive_timeout 60s;
}

# Local rope-node ONLY. Used by `/healthz` so an operator probe here
# gives an honest local answer, not a failover-covered one.
upstream rope_rpc_local_only {
    server 127.0.0.1:8545;
    keepalive 8;
    keepalive_requests 100;
    keepalive_timeout 30s;
}

# Local WebSocket. WS-failover across nodes is intentionally NOT
# configured — a WSS session that reconnects during a failover event
# should re-resolve DNS and land wherever the current authoritative
# A record points. Mid-session failover is a much larger design change
# (session replication + subscription state migration) and out of
# scope for this drop.
upstream rope_ws_local {
    server 127.0.0.1:8546;
    keepalive 16;
    keepalive_requests 500;
    keepalive_timeout 300s;
}

# ------------------------------------------------------------------
# HTTP → HTTPS
# ------------------------------------------------------------------

server {
    listen 80;
    server_name erpc.datachain.network ws.datachain.network;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------
# erpc.datachain.network (JSON-RPC edge)
# ------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name erpc.datachain.network;

    ssl_certificate     /opt/datachain-rope/ssl/erpc.datachain.network/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/erpc.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # H8 (2026-07-25 audit): HSTS + rate limit at server level so every
    # location inherits them without repeat.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    limit_req zone=rpc burst=50 nodelay;
    limit_req_status 429;

    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # -- Local-only healthz (honest, no failover backing) ------------
    location = /healthz {
        proxy_pass http://rope_rpc_local_only;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    # -- fleet-status stubs (single-source contract from §16) --------
    #
    # fleet-status is generated only on BLUE. When DNS has failed over
    # to a DO node, the endpoint must return a well-formed JSON that
    # CERBER R12 recognises as "documented failover state" rather than
    # "endpoint returning garbage". Anything other than a 200-with-
    # writer-status OR this 503-with-status-marker causes R12 to page.
    #
    # See §16.2 for the shape.
    location = /v1/fleet-status {
        return 503 '{"status":"failover_no_fleet_status","served_by":"do-rpc-2","note":"you are talking to DO-rpc-2 because erpc.datachain.network has failed over from BLUE; fleet-status is only generated on BLUE. Treat edge=degraded and writer=unknown during this window.","canonical_when_blue_up":"https://erpc.datachain.network/v1/fleet-status"}';
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
    }
    location = /v1/fleet-status.signed.json {
        return 503 '{"status":"failover_no_fleet_status","served_by":"do-rpc-2","canonical_when_blue_up":"https://erpc.datachain.network/v1/fleet-status.signed.json"}';
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
    }
    location = /v1/fleet-status.sig.json {
        return 503 '{"status":"failover_no_fleet_status","served_by":"do-rpc-2","canonical_when_blue_up":"https://erpc.datachain.network/v1/fleet-status.sig.json"}';
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
    }

    # -- CORS preflight (for browser-based wallets) ------------------
    location / {
        if ($request_method = OPTIONS) {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://rope_rpc_edge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # V11 hot-fix (2026-06-12): strip any inbound copy of the
        # internal-bypass header so an internet-side caller can never
        # forge it into a V11 destructive-method gate bypass. Applies
        # here too because DO nodes are DNS-failover-eligible and can
        # therefore receive public write traffic.
        # See docs/SECURITY_AUDIT_2026-06-11.md.
        proxy_set_header X-Rope-Internal-Token "";

        # Read failover: nginx retries the next upstream on connection
        # errors, upstream timeouts, and 502/503/504 responses. Bounded
        # by _tries + _timeout to prevent unbounded fallback.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        proxy_connect_timeout 3s;
        proxy_send_timeout   10s;
        proxy_read_timeout   60s;
    }
}

# ------------------------------------------------------------------
# ws.datachain.network (WebSocket edge, local-only)
# ------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name ws.datachain.network;

    ssl_certificate     /opt/datachain-rope/ssl/ws.datachain.network/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/ws.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://rope_ws_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # V11 hot-fix (2026-07-25 audit finding H2, §15).
        proxy_set_header X-Rope-Internal-Token "";

        # WebSocket long-poll timeouts.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
