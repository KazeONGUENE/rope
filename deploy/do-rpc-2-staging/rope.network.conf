# rope.network — DO-rpc-2 failover mirror
#
# Deploy path on DO-rpc-2 (167.172.106.174):
#     /etc/nginx/conf.d/rope.network.conf
#
# Mirrors DO-rpc-1's rope.network.conf (deployed 2026-08-11 per §13).
# Depends on the upstreams declared in `datachain.network.conf` — deploy
# THAT file first, or nginx will refuse to reload with "upstream
# rope_rpc_edge not found".
#
# Reuses `rope_rpc_edge` (local → BLUE → DO-rpc-1 failover) so a public
# request to erpc.rope.network on this box has the same 3-way failover
# story as erpc.datachain.network. `rope_rpc_local_only` powers /healthz.

# ------------------------------------------------------------------
# HTTP → HTTPS
# ------------------------------------------------------------------

server {
    listen 80;
    server_name rope.network www.rope.network erpc.rope.network ws.rope.network;
    return 301 https://$host$request_uri;
}

# Apex + www: redirect to canonical datachain.network landing.
server {
    listen 443 ssl http2;
    server_name rope.network www.rope.network;

    ssl_certificate     /opt/datachain-rope/ssl/rope.network/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/rope.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://datachain.network$request_uri;
}

# ------------------------------------------------------------------
# erpc.rope.network — RPC edge with 3-way failover
# ------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name erpc.rope.network;

    ssl_certificate     /opt/datachain-rope/ssl/erpc.rope.network/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/erpc.rope.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    limit_req zone=rpc burst=50 nodelay;
    limit_req_status 429;

    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    location = /healthz {
        proxy_pass http://rope_rpc_local_only;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
    }

    # fleet-status is BLUE-single-source. Return the failover marker
    # so CERBER R12 recognises the shape and does not page. See §16.2.
    location = /v1/fleet-status {
        return 503 '{"status":"failover_no_fleet_status","served_by":"do-rpc-2","canonical":"https://erpc.datachain.network/v1/fleet-status","note":"fleet-status is only published by BLUE (rope-vps); this endpoint returns 503 to force CERBER peers to the canonical source."}';
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
    }
    location = /v1/fleet-status.signed.json {
        return 503 '{"status":"failover_no_fleet_status","served_by":"do-rpc-2","canonical":"https://erpc.datachain.network/v1/fleet-status.signed.json"}';
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
    }
    location = /v1/fleet-status.sig.json {
        return 503 '{"status":"failover_no_fleet_status","served_by":"do-rpc-2","canonical":"https://erpc.datachain.network/v1/fleet-status.sig.json"}';
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://rope_rpc_edge;
        proxy_http_version 1.1;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # V11 hot-fix (§13 legacy vhost missed the fix — mirroring the
        # DO-rpc-1 correction so DO-rpc-2 doesn't reopen the same gap).
        proxy_set_header X-Rope-Internal-Token "";

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        proxy_connect_timeout 3s;
        proxy_send_timeout   10s;
        proxy_read_timeout   60s;
    }
}

# ------------------------------------------------------------------
# ws.rope.network — WebSocket edge, local-only
# ------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name ws.rope.network;

    ssl_certificate     /opt/datachain-rope/ssl/ws.rope.network/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/ws.rope.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://rope_ws_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # V11 hot-fix (2026-07-25 audit finding H2, §15).
        proxy_set_header X-Rope-Internal-Token "";

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 60s;
    }
}
