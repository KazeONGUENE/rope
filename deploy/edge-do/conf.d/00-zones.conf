# DO EDGE — shared rate-limit / connection-limit zones
# Must load before the vhost files (00- prefix guarantees ordering).
limit_req_zone $binary_remote_addr zone=rpc:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=dcscan_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dcscan_pages:10m rate=10r/s;
# H8 (2026-07-25 audit): faucet/bridge had no rate limit at all on this
# edge tier; api zone doubles as the general catch-all for those vhosts.
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=faucet:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;
