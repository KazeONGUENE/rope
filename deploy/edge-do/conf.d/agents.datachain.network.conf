# DO EDGE — agents.datachain.network umbrella + agent proxies
# The SemanticAgent (:9092) and ComplianceAgent (:9091) processes run on BLUE
# only, so this edge proxies to BLUE for those two hosts. The umbrella landing
# is served from the synced static copy so it stays up even if BLUE is down.

upstream semantic_agent_edge {
    server 92.243.26.189:9092 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream compliance_agent_edge {
    server 92.243.26.189:9091 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    server_name semantic-agent.datachain.network compliance-agent.datachain.network agents.datachain.network;

    location /.well-known/acme-challenge/ {
        root /opt/datachain-rope/edge/html/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name semantic-agent.datachain.network;

    ssl_certificate     /opt/datachain-rope/ssl/agents.datachain.network/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/agents.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin  "*"            always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type" always;

    location / {
        proxy_pass http://semantic_agent_edge;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}

server {
    listen 443 ssl http2;
    server_name compliance-agent.datachain.network;

    ssl_certificate     /opt/datachain-rope/ssl/agents.datachain.network/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/agents.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin  "*"             always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type"  always;

    client_max_body_size 32k;

    location / {
        proxy_pass http://compliance_agent_edge;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }
}

server {
    listen 443 ssl http2;
    server_name agents.datachain.network;

    ssl_certificate     /opt/datachain-rope/ssl/agents.datachain.network/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/agents.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;

    root  /opt/datachain-rope/edge/html/agents;
    index index.html;

    location = /agents.json {
        return 200 "{\"agents\":[\"semantic-agent.datachain.network\",\"compliance-agent.datachain.network\"],\"status\":\"https://dcscan.io/agents\",\"registry\":\"https://dcscan.io/api/v1/ai-agents\"}
";
        add_header Content-Type "application/json" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
