# DO EDGE — dcscan.io / api.dcscan.io
# Runs on datachain-rpc-1 (157.230.18.45). Serves the local dc-explorer (:3001)
# and the synced static site so dcscan.io stays up when BLUE is down.

server {
    listen 80;
    server_name dcscan.io www.dcscan.io api.dcscan.io;

    location /.well-known/acme-challenge/ {
        root /opt/datachain-rope/edge/html/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dcscan.io www.dcscan.io;

    ssl_certificate /opt/datachain-rope/ssl/dcscan.io/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/dcscan.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # H8 (2026-07-25 audit): HSTS was missing on this edge vhost.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn addr 50;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /opt/datachain-rope/edge/html/dcscan;
    index index.html;

    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    location /api/ {
        limit_req zone=dcscan_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # H8: re-declared — this location already sets its own add_header
        # directives (CORS below), which suppresses the server-level HSTS.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

        if ($request_method = OPTIONS) {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    location ~ ^/tx/0x[a-fA-F0-9]+ {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /tx/index.html =404;
    }
    location ~ ^/address/0x[a-fA-F0-9]+ {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /address/index.html =404;
    }
    location ~ ^/string/[0-9]+ {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /string/index.html =404;
    }
    location ~ ^/token/0x[a-fA-F0-9]+ {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /token/index.html =404;
    }

    location / {
        limit_req zone=dcscan_pages burst=30 nodelay;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name api.dcscan.io;

    ssl_certificate /opt/datachain-rope/ssl/api.dcscan.io/fullchain.pem;
    ssl_certificate_key /opt/datachain-rope/ssl/api.dcscan.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    limit_conn addr 30;

    # H8 (2026-07-25 audit): HSTS was missing on api.dcscan.io.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

    location / {
        limit_req zone=dcscan_api burst=60 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
