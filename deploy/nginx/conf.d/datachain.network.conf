# datachain.network - Primary Website
# erpc.datachain.network - RPC API
# ws.datachain.network - WebSocket

# Upstream for Anvil EVM — automatic failover
# Primary: Reth EVM on port 8595 (iptables redirects Docker 8597 → localhost:8595)
# Backup: rope-mainnet-node-2 (full rope-node)
# Failover triggers on: connection error, timeout, HTTP 502/503/504
upstream digitalocean_rpc {
    server host.docker.internal:8545 max_fails=2 fail_timeout=5s;
    server 92.243.25.119:8545 backup;
    # Secondary promoted to full rope-node (2026-04-16)
    server 157.230.18.45:8545 backup;  # DO rpc-1 (third blue-green slot, 2026-05-03)
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name datachain.network www.datachain.network erpc.datachain.network ws.datachain.network faucet.datachain.network bridge.datachain.network;
    return 301 https://$host$request_uri;
}

# Main website
server {
    listen 443 ssl;
    http2 on;
    server_name datachain.network www.datachain.network;

    ssl_certificate /etc/nginx/ssl/datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/datachain.network/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /usr/share/nginx/html/datachain;
    index index.html;

    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    }

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# RPC Endpoint — with automatic failover to secondary Anvil
server {
    listen 443 ssl;
    http2 on;
    server_name erpc.datachain.network;

    ssl_certificate /etc/nginx/ssl/erpc.datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/erpc.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    limit_req zone=rpc burst=50 nodelay;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_pass http://digitalocean_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Failover: if primary times out in 10s, try secondary immediately
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 15s;
        proxy_next_upstream_tries 2;

        proxy_buffering off;
        proxy_request_buffering off;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
}

# WebSocket Endpoint — with failover
server {
    listen 443 ssl;
    http2 on;
    server_name ws.datachain.network;

    ssl_certificate /etc/nginx/ssl/ws.datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ws.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://digitalocean_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 2s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;
    }
}

