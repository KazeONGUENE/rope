# datachain.network - Primary Website
# erpc.datachain.network - RPC API
# ws.datachain.network - WebSocket

# 2026-07-26: method-aware read failover (rpc_router.js, njs/rpc_router.js
# in this directory). Restores real 4-node redundancy for read-only calls
# - exactly what MetaMask needs for eth_chainId / eth_getBalance /
# eth_call / eth_blockNumber, i.e. "at least one of the 4 foundation
# nodes should always answer" - while keeping every write call pinned to
# BLUE only, per the mempool-hazard fix documented below. See
# rpc_router.js for the full writeup of why write calls can never be
# allowed to fail over.
# NOTE: `load_module /usr/lib/nginx/modules/ngx_http_js_module.so;` must be
# the first line of nginx.conf (main context, outside http{}) for the
# js_import below to resolve - see /opt/datachain-rope/code/deploy/nginx/nginx.conf.
js_import rpc_router from /etc/nginx/conf.d/njs/rpc_router.js;

# Upstream for Rope EVM RPC - PROPOSER-ONLY writes (2026-07-25 incident fix)
#
# Datachain Rope's 4-node committee has exactly ONE block proposer (BLUE =
# this host, rope-vps); 92.243.25.119 / 157.230.18.45 / 167.172.106.174 are
# attester/witness-only Reth replicas that independently re-execute and sign
# blocks BLUE proposes - they never build blocks from their own local
# mempool, and there is no devp2p tx-pool gossip between committee members
# (each node reports net_peerCount=0; block sync happens over the
# Engine-API-driven quorum protocol, not classic p2p).
#
# Consequence: any write call (eth_sendRawTransaction) that nginx failed
# over to a backup attester node during a primary blip got accepted into
# THAT node's local tx pool and then sat there forever - silently unmined,
# with no error to the client and no timeout. That is exactly what happened
# to 0x8fe79e019172820610fe643dbd45a26e78e0ebfe92b8dd80bb0e1bcadf1fdbe2
# (500M FAT escrow top-up), which we had to manually extract from
# 157.230.18.45's mempool and rebroadcast to BLUE to unstick.
#
# Fix (2026-07-25): route 100% of write calls to BLUE only, always. Do NOT
# add backup servers to this upstream unless/until the attester nodes gain
# a tx-forwarding path to BLUE's mempool.
upstream rpc_primary_only {
    # 2026-08-24 writer-promote to new BLUE (loopback via docker host); GREEN demoted to attester
    server host.docker.internal:8545 max_fails=3 fail_timeout=5s;
    # 2026-08-04 tune (tanastok external-view handover): bump keepalive pool
    # 32 -> 64 (rpc zone burst is 50, so 32 was undersized under coincident
    # peer probes + wallet traffic); add keepalive_requests 10000 so a hot
    # socket is not recycled after 100 requests (nginx default) mid-burst,
    # which was the most likely source of the intermittent 502s observed by
    # cerber-tanastok when Reth's RPC executor briefly saturates; add
    # keepalive_timeout 300s so idle sockets survive quiet gaps between
    # probe waves instead of being torn down every 60s. proxy_socket_keepalive
    # is set at http { } level below to detect half-open sockets faster.
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# Upstream for Rope EVM RPC - READ failover across the full committee
# (2026-07-26 follow-up fix). Reads (eth_call, eth_getBalance,
# eth_blockNumber, eth_chainId, eth_gasPrice, rope_*, net_*, web3_*, ...)
# are safe to fail over: every committee member independently re-executes
# and signs every block BLUE proposes, so at 4/4 quorum all 4 nodes hold
# byte-identical state. Only BLUE ever answers a write (see
# rpc_primary_only above); rpc_router.js routes write-shaped POST bodies
# there and everything else here. BLUE is tried first; the 3 others are
# `backup` and are only used if BLUE doesn't answer inside
# proxy_connect_timeout (see the erpc.datachain.network server block).
upstream rpc_read_failover {
    # 2026-07-26 follow-up (DCSwap handover "two blockers owned by Rope"):
    # with the nginx default (max_fails=1 fail_timeout=10s), a single
    # transient blip on BLUE (memory-pressure-induced slow response, not
    # an actual outage) was enough to pin every read for the next 10s onto
    # a `backup` follower running an older rope-node binary - confirmed live
    # by comparing this endpoint's Cache-Control header (public, max-age=2,
    # matching GREEN/DO-rpc-1/DO-rpc-2's older binary) against BLUE's direct
    # response (no-store, current binary) while BLUE was independently
    # verified healthy and fast (0.11-0.15s TCP+HTTP round trip). Because
    # nothing in this pool was un-sticking it, reads stayed pinned to a
    # stale follower far longer than any real BLUE hiccup. max_fails=3
    # requires three consecutive failures (not one slow response) before
    # failing over, and fail_timeout=5s halves the recovery window so BLUE
    # is retried sooner once it's healthy again.
    server host.docker.internal:8545 max_fails=3 fail_timeout=5s;
    server 92.243.25.119:8545 backup; # GREEN attester (ISO 2026-08-26)
    server 157.230.18.45:8545 backup;
    server 167.172.106.174:8545 backup;
    server 92.243.26.189:8545 backup; # Paris legacy attester (ISO 2026-09-01)
    # 2026-08-04 tune (same rationale as rpc_primary_only above): bigger
    # pool + longer socket lifetime so a Reth executor burst does not evict
    # sockets mid-read and produce a 502 that would then be papered over by
    # proxy_next_upstream falling through to a follower. Fewer forced
    # failovers means less follower-pinning risk documented in the block
    # comment above (2026-07-26 fix).
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# Kept for the WebSocket server block below, which is not (yet) covered by
# the method-aware router - see that server block's own comment.
upstream digitalocean_rpc {
    server host.docker.internal:8545;
    # 2026-08-04 tune: mirror rpc_primary_only sizing (this upstream is used
    # by the WebSocket server block only; smaller footprint than the
    # method-aware read/write path but same recycle-mid-burst concern).
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# 2026-08-11 ws.datachain.network fix: rope-node WebSocket listener now
# bound 0.0.0.0:8546 with per-connection V11 auth (peer_addr + XFF +
# internal-token). Route the ws.datachain.network vhost here instead of
# to digitalocean_rpc (which is HTTP-only :8545). Same keepalive sizing
# as the HTTP pool - WS connections are long-lived, so most of it goes
# unused, but the values are cheap and consistent.
#
# 2026-08-23 Tier B: promoted from 1 server (BLUE only) to 4 servers.
# GREEN/DO-1/DO-2 each had ws_addr flipped from 127.0.0.1:8546 to
# 0.0.0.0:8546 in rope-production.toml + UFW `allow proto tcp from
# 92.243.26.189 to any port 8546` added, verified reachable with a WS
# handshake returning HTTP 101 Switching Protocols before this reload.
# Same failover shape as rpc_read_failover: BLUE first, 4 attester
# backups. proxy_next_upstream in the ws.datachain.network server block
# will move a wedged BLUE connection to the next healthy backend within
# ~2s, which is what closes the Chainlist WS red-mark during BLUE MTBF.
#
# nginx-audit: role=ws_read min_backends=4 port=8546 include_blue=true
upstream rope_ws {
    server host.docker.internal:8546 max_fails=3 fail_timeout=5s;
    server 92.243.25.119:8546 backup; # GREEN attester (ISO 2026-08-26)
    server 157.230.18.45:8546 backup;
    server 167.172.106.174:8546 backup;
    server 92.243.26.189:8546 backup; # Paris legacy attester (ISO 2026-09-01)
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# Attester-only READ pool (2026-08-14, DCSwap erpc-permanent-solution §4.3).
# GREEN + DO-rpc-1 + DO-rpc-2 - never BLUE. When BLUE rope-node restarts,
# nginx on this host stays up and these three still answer eth_* reads, so
# a client FallbackProvider that puts https://erpc.datachain.network/v1/read
# second (or third) in the cascade does not share BLUE's 5xx window.
# All three are active (not backup) so nginx round-robins; a dead attester
# is skipped via max_fails + proxy_next_upstream on @rpc_attesters.
# Writes MUST never land here (njs routeAttesterRead rejects them with 405).
upstream rpc_attesters_only {
    server 92.243.25.119:8545 max_fails=2 fail_timeout=5s; # GREEN attester (ISO 2026-08-26)
    server 157.230.18.45:8545 max_fails=2 fail_timeout=5s;
    server 167.172.106.174:8545 max_fails=2 fail_timeout=5s;
    server 92.243.26.189:8545 max_fails=2 fail_timeout=5s; # Paris legacy attester (ISO 2026-09-01)
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# CERBER R14 - defensive-deception tarpit upstream.
# The classifier (cerber-rpc-classify.timer, every 15 min) rewrites the tarpit
# map input at /etc/nginx/conf.d/malicious-ips.include; the map declared in
# conf.d/tarpit.map.conf flips $rope_tarpit_flag = malicious for those IPs.
# The erpc `location /` then internally hands the request off to @rpc_tarpit
# (via `return 418` + `error_page 418 = @rpc_tarpit;`), which proxy_passes
# here. The tarpit itself (cerber-rpc-tarpit.service, 127.0.0.1:9099) answers
# with slow, plausible-but-fake JSON-RPC replies so scanners/DDoS wave sources
# burn budget on a decoy instead of the real chain. Fail-safe: if the tarpit
# is down, nginx serves 502 - it MUST NOT fail over to the real upstream
# (that would defeat the whole point - malicious IPs must never touch the
# real chain once flagged).
upstream rpc_tarpit {
    server 127.0.0.1:9099 max_fails=2 fail_timeout=5s;
    keepalive 8;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name datachain.network www.datachain.network erpc.datachain.network ws.datachain.network faucet.datachain.network bridge.datachain.network;
    return 301 https://$host$request_uri;
}

# Main website
server {
    listen 443 ssl;
    http2 on;
    server_name datachain.network www.datachain.network;

    ssl_certificate /etc/nginx/ssl/datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/datachain.network/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /usr/share/nginx/html/datachain;
    index index.html;

    # Never serve editor/deploy backup or hidden files (security: leaked .bak
    # files exposed real API keys on 2026-07-07).
    location ~ \.(bak|old|orig|save)(-|\.|$)|~$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    }

    # 2026-08-29 (KJ Stevens onboarding feedback): the docs at
    # datachain.network/docs contain <a href="/faucet/">, and the SPA
    # `try_files ... /index.html` fallback below was silently rewriting
    # /faucet and /faucet/ to the homepage. A developer clicking that link
    # landed on the marketing landing page with no explanation - exactly the
    # broken-onboarding class KJ flagged. The real faucet page lives on the
    # `faucet.datachain.network` subdomain (root
    # /usr/share/nginx/html/faucet, definition below), so we 301 both
    # variants to the canonical subdomain. This must sit ABOVE the greedy
    # `location /` SPA fallback for it to win. Cerber R15 (docs-drift)
    # monitors https://faucet.datachain.network/ directly - see
    # deploy/cerber/lib/docs-drift.mjs::faucetUrl.
    location = /faucet  { return 301 https://faucet.datachain.network/; }
    location = /faucet/ { return 301 https://faucet.datachain.network/; }

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# RPC Endpoint - method-aware failover (2026-07-26): reads fail over across
# the full 4-node committee, writes are pinned to BLUE only. See
# rpc_router.js and the rpc_primary_only / rpc_read_failover upstreams above.
server {
    listen 443 ssl;
    http2 on;
    server_name erpc.datachain.network;

    ssl_certificate /etc/nginx/ssl/erpc.datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/erpc.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    limit_req zone=rpc burst=50 nodelay;

    # /healthz (2026-07-26, DCSwap handover "two blockers owned by Rope"
    # ask #2.3): a dedicated, fast-failing status probe so a client-side
    # circuit breaker (e.g. DCSwap's CERBER) can distinguish "erpc is in a
    # burst / BLUE is unhealthy right now" from "our own request was bad",
    # without needing to interpret a real JSON-RPC 5xx. Talks to BLUE only
    # (rpc_primary_only) - the same node writes are pinned to - with a
    # short 2.5s total budget, well under the 15s write timeout below, so
    # a caller gets a fast, unambiguous signal instead of waiting out a
    # full write-path timeout just to learn BLUE is slow. Never fails over:
    # a health probe that silently answered from a backup node would lie
    # about the one node that actually matters for writes.
    location = /healthz {
        proxy_pass http://rpc_primary_only;
        proxy_http_version 1.1;
        proxy_method POST;
        proxy_set_header Content-Type "application/json";
        proxy_set_body '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}';
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Rope-Internal-Token "";

        proxy_connect_timeout 1s;
        proxy_send_timeout 1500ms;
        proxy_read_timeout 1500ms;
        proxy_next_upstream off;

        proxy_intercept_errors on;
        error_page 502 504 = @healthz_down;

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "application/json" always;
    }

    location @healthz_down {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":"unhealthy","node":"BLUE","reason":"primary did not answer eth_blockNumber within budget"}';
    }

    # Fleet status for CERBER / peers (2026-07-28 HA). Written by
    # erpc-fleet-ha.sh every 30s into the nginx html bind-mount.
    location = /v1/fleet-status {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        alias /usr/share/nginx/html/fleet/fleet-status.json;
    }

    # Detached Ed25519 envelope for fleet-status (CERBER mesh, 2026-07-29).
    location = /v1/fleet-status.sig.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        alias /usr/share/nginx/html/fleet/fleet-status.sig.json;
    }

    # Atomic signed bundle { body, envelope } - preferred by R13 (no two-GET race).
    location = /v1/fleet-status.signed.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        alias /usr/share/nginx/html/fleet/fleet-status.signed.json;
    }

    # CERBER edge-probe ingest - receives signed external probes from
    # trusted peers (cerber-tanastok, cerber-dcswap, cerber-alteros, ...) so
    # the fleet edge picture can incorporate views from outside the loopback
    # sampler. Sits BEFORE the /v1/cerber/ prefix so this exact-match path
    # routes to the ingest daemon (:9109) instead of cerber-mesh (:9107).
    # Backend: cerber-edge-ingest.service on host :9109 (loopback-only bind;
    # nginx reaches it via host.docker.internal).
    location = /v1/cerber/edge-probe {
        # Only signed POSTs from trusted peers per frozen v1 spec.
        limit_except POST OPTIONS { deny all; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        # Signed envelope < 16 KB per spec §2.4.
        client_max_body_size 16k;
        client_body_buffer_size 16k;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Daemon serves /v1/mesh/edge-probe internally; rewrite path so external
        # callers see the canonical spec URL /v1/cerber/edge-probe.
        proxy_pass http://host.docker.internal:9109/v1/mesh/edge-probe;
    }

    # CERBER mesh API - node-signed verification reports + peer gossip.
    # Backend: cerber-mesh.service on host :9107 (Docker → host.docker.internal).
    location /v1/cerber/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin * always;
        proxy_pass http://host.docker.internal:9107/v1/cerber/;
    }

    # Public attester-only JSON-RPC (2026-08-14). GET returns a descriptor;
    # POST of eth_* reads is round-robined across GREEN/DO; writes and
    # every rope_* method are rejected (405) so this URL can never mint a
    # ghost tx. Exact-match so it wins over location /.
    location = /v1/read {
        js_content rpc_router.routeAttesterRead;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # CERBER R14 tarpit gate.
        # $rope_tarpit_flag is set by the map in conf.d/tarpit.map.conf; it is
        # `malicious` for every IP the classifier persisted into
        # /etc/nginx/conf.d/malicious-ips.include, and `normal` for everyone
        # else. We divert malicious traffic to the deception service BEFORE
        # js_content takes over the content phase. `if` in a `location` is
        # only safe with `return` and `set` (nginx `IfIsEvil`); this uses
        # `return 418`, then `error_page 418 = @rpc_tarpit;` internally
        # redirects to the named location. OPTIONS preflights above are
        # answered normally, so malicious clients can't fingerprint the
        # tarpit via a CORS probe either.
        error_page 418 = @rpc_tarpit;
        # R14-DISABLED--incident tarpit gate below: was 502ing dcswap/tanastok/fleet + CF CDN
        # if ($rope_tarpit_flag = malicious) {
        #     return 418;
        # }

        # Reads the full POST body, parses the JSON-RPC `method` field, and
        # internally redirects to @rpc_primary (writes) or @rpc_failover
        # (everything else). See rpc_router.js for the fail-safe rules.
        js_content rpc_router.route;
    }

    location @rpc_primary {
        internal;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        # Must hide the backend's own Cache-Control before add_header below,
        # otherwise nginx sends BOTH headers in the same response (add_header
        # adds, it does not replace) and a client can pick either one.
        proxy_hide_header Cache-Control;

        proxy_pass http://rpc_primary_only;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # V11 hot-fix: strip any inbound copy of the internal-bypass header
        # so an internet-side caller can never forge it. See
        # docs/SECURITY_AUDIT_2026-06-11.md and rope-node/src/rpc_auth.rs.
        proxy_set_header X-Rope-Internal-Token "";

        # No proxy_next_upstream here on purpose: a write call must never be
        # allowed to land on anything other than BLUE.
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_buffering off;
        proxy_request_buffering off;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        # Defense-in-depth (2026-07-26): force no-store at the nginx layer
        # regardless of which backend answers. The current rope-node
        # binary already emits no-store, but 3 of the 4 fleet nodes are
        # still running an older binary that emits `public, max-age=2`
        # (see the rpc_read_failover comment above) - a stale cached
        # JSON-RPC response is exactly the kind of thing that turns a
        # transient 5xx into a client silently replaying a wrong answer.
        # Remove this once the whole fleet is confirmed on a binary that
        # emits no-store on every code path.
        add_header Cache-Control "no-store" always;
    }

    location @rpc_failover {
        internal;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        # See matching comment in @rpc_primary above.
        proxy_hide_header Cache-Control;

        proxy_pass http://rpc_read_failover;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # V11 hot-fix: strip any inbound copy of the internal-bypass header
        # so an internet-side caller can never forge it. See
        # docs/SECURITY_AUDIT_2026-06-11.md and rope-node/src/rpc_auth.rs.
        proxy_set_header X-Rope-Internal-Token "";

        # Failover: hung BLUE (accepts TCP, never answers) must not pin
        # MetaMask for 10s+. 2026-07-28: tighten to 3s so eth_* reads move
        # to GREEN/DO inside one mobile-wallet timeout. Safe for reads only.
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 4;

        proxy_buffering off;
        proxy_request_buffering off;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        # Defense-in-depth (2026-07-26): see the matching comment in
        # @rpc_primary above - this is the location that was actually
        # observed serving `public, max-age=2` from a stale follower node.
        add_header Cache-Control "no-store" always;
    }

    location @rpc_attesters {
        internal;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Cache-Control;

        proxy_pass http://rpc_attesters_only;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Rope-Internal-Token "";

        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 3;

        proxy_buffering off;
        proxy_request_buffering off;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Cache-Control "no-store" always;
        add_header X-Rope-Read-Pool "attesters-only" always;
    }

    # CERBER R14 - defensive-deception tarpit handoff.
    # Reached only via the `return 418` + `error_page 418 = @rpc_tarpit;` path
    # from `location /` above, i.e. only for requests whose $remote_addr was
    # in /etc/nginx/conf.d/malicious-ips.include at map-load time. Proxies to
    # 127.0.0.1:9099 (cerber-rpc-tarpit.service), which answers with slow
    # plausible-but-fake JSON-RPC. NO proxy_next_upstream here on purpose: if
    # the tarpit is down the caller gets 502, they must NEVER escape back to
    # the real upstream once flagged.
    location @rpc_tarpit {
        internal;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Cache-Control;

        proxy_pass http://rpc_tarpit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Rope-Internal-Token "";

        # Tarpit is designed to answer slowly (see
        # CERBER_RPC_TARPIT_DELAY_MS in cerber-rpc-tarpit.service). Read
        # budget must be at least that plus jitter, but not so large it
        # starves worker connections. 60s is enough to keep an attacker's
        # client hanging on their side too.
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_request_buffering off;

        # Uniform CORS + no-cache so the response envelope is
        # indistinguishable from @rpc_failover from the outside. The response
        # body itself carries a plausible-but-wrong JSON-RPC payload.
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Cache-Control "no-store" always;
        add_header X-Rope-Read-Pool "tarpit" always;
    }
}

# WebSocket Endpoint - with failover (Tier B: 4-server upstream since 2026-08-23)
# NOT covered by rpc_router.js (njs doesn't intercept upgraded/streaming
# connections the same way): a WS client that subscribes to a follower
# during a BLUE blip only loses live-tail delivery, it can't get a write
# accepted into the wrong mempool (subscriptions are read-only), so the
# failover here was never the unsafe case - only the request/response RPC
# upstream was. Post-Tier-B, `rope_ws` has 3 attester backups behind BLUE
# so ws.datachain.network stays green through the ~7 min BLUE MTBF wedge.
server {
    listen 443 ssl;
    http2 on;
    server_name ws.datachain.network;

    ssl_certificate /etc/nginx/ssl/ws.datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ws.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # 2026-08-11 fix: proxy to the rope_ws upstream (host.docker.internal:8546)
        # instead of digitalocean_rpc (:8545). The rope-node WS listener sits on
        # :8546 and speaks the WebSocket handshake. Proxying to :8545 caused the
        # 90-second-timeout symptom reported by peers because :8545 is a plain
        # HTTP JSON-RPC endpoint and never returns 101 Switching Protocols.
        proxy_pass http://rope_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # V11: strip any inbound internal-bypass header. The rope-node WS
        # handler now runs the same auth gate as the HTTP handler, so a
        # forged token here can't grant destructive-RPC access.
        proxy_set_header X-Rope-Internal-Token "";

        proxy_connect_timeout 2s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # 2026-08-23 Tier B: raise _tries from 2 to 4 to match the 4-server
        # rope_ws pool (BLUE + 3 attester backups). Total failover budget
        # stays at 10s so a Chainlist probe never sees more than a single
        # 10s window when BLUE is mid-restart.
        proxy_next_upstream error timeout;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 4;
    }
}

# Faucet - Testnet xFAT drip UI + JSON-RPC pass-through
# Backend: testnet-faucet.service on 172.18.0.1:3100
# Chain: Datachain Rope Testnet (chainId 271829, xFAT)
# Deployed 2026-08-30 in response to operator directive "make it works".
server {
    listen 443 ssl;
    http2 on;
    server_name faucet.datachain.network;

    ssl_certificate /etc/nginx/ssl/faucet.datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/faucet.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/faucet;
    index index.html;

    # Never serve editor/deploy backup or hidden files (security: leaked .bak
    # files exposed real API keys on 2026-07-07).
    location ~ \.(bak|old|orig|save)(-|\.|$)|~$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    # Faucet drip - rate-limited 2 req/s at edge; backend also enforces
    # 1 drip / address / 24h and 3 drips / IP / 24h independently.
    location = /api/drip {
        limit_req zone=faucet_api burst=5 nodelay;
        if ($request_method != POST) { return 405; }
        proxy_pass http://172.18.0.1:3100/api/drip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 20s;
    }

    location = /api/status {
        limit_req zone=faucet_api burst=5 nodelay;
        proxy_pass http://172.18.0.1:3100/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Public JSON-RPC pass-through for testnet.  Backend enforces the
    # method allowlist (read + eth_sendRawTransaction; no admin_/personal_/
    # engine_/debug_/miner_).
    location = /rpc {
        limit_req zone=faucet_rpc burst=40 nodelay;
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        proxy_pass http://172.18.0.1:3100/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://172.18.0.1:3100/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Static UI
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Bridge
server {
    listen 443 ssl;
    http2 on;
    server_name bridge.datachain.network;

    ssl_certificate /etc/nginx/ssl/bridge.datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bridge.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/bridge;
    index index.html;

    # Never serve editor/deploy backup or hidden files (security: leaked .bak
    # files exposed real API keys on 2026-07-07).
    location ~ \.(bak|old|orig|save)(-|\.|$)|~$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
