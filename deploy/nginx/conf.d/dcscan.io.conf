# dcscan.io - DC Explorer

server {
    listen 80;
    server_name dcscan.io www.dcscan.io api.dcscan.io testnet.dcscan.io;
    return 301 https://$host$request_uri;
}

# DC Explorer Frontend
server {
    listen 443 ssl;
    http2 on;
    server_name dcscan.io www.dcscan.io;

    ssl_certificate /etc/nginx/ssl/dcscan.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dcscan.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Connection limit per IP
    limit_conn addr 50;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /usr/share/nginx/html/dcscan;
    index index.html;

    # Redirect .html URLs to clean URLs
    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # API Proxy — rate limited
    location /api/ {
        limit_req zone=dcscan_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # NOTE on add_header semantics: nginx inherits add_header from the parent only when the child
    # has no add_header at all. As soon as a location adds ONE header, the server-level directives
    # are dropped, so each HTML location block below re-emits the security headers explicitly.

    # Dynamic detail pages — HTML must always revalidate
    location ~ ^/tx/0x[a-fA-F0-9]+ {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /tx/index.html =404;
    }
    location ~ ^/address/0x[a-fA-F0-9]+ {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /address/index.html =404;
    }
    location ~ ^/string/[0-9]+ {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /string/index.html =404;
    }
    location ~ ^/token/0x[a-fA-F0-9]+ {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /token/index.html =404;
    }

    # General pages — HTML must revalidate every time. ETag/Last-Modified make this cheap (~150 byte 304s).
    # Without this header browsers fall back to heuristic caching (~10% of last-modified age) and keep
    # serving stale HTML for days after a redesign — that's what caused the "two homepages" report on 2026-05-06.
    location / {
        limit_req zone=dcscan_pages burst=30 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    # Static assets — no rate limit, long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Explorer API - api.dcscan.io — rate limited
server {
    listen 443 ssl;
    http2 on;
    server_name api.dcscan.io;

    ssl_certificate /etc/nginx/ssl/api.dcscan.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.dcscan.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    limit_conn addr 30;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

    location / {
        limit_req zone=dcscan_api burst=60 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# Testnet Explorer
server {
    listen 443 ssl;
    http2 on;
    server_name testnet.dcscan.io;

    ssl_certificate /etc/nginx/ssl/testnet.dcscan.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/testnet.dcscan.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_conn addr 30;

    root /usr/share/nginx/html/dcscan;
    index index.html;

    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    location ~ ^/tx/0x[a-fA-F0-9]+ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /tx/index.html =404;
    }
    location ~ ^/address/0x[a-fA-F0-9]+ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /address/index.html =404;
    }
    location ~ ^/string/[0-9]+ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /string/index.html =404;
    }
    location ~ ^/token/0x[a-fA-F0-9]+ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /token/index.html =404;
    }

    location / {
        limit_req zone=dcscan_pages burst=20 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
