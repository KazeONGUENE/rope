# dcscan.io - DC Explorer

server {
    listen 80;
    server_name dcscan.io www.dcscan.io api.dcscan.io testnet.dcscan.io;
    return 301 https://$host$request_uri;
}

# DC Explorer Frontend
server {
    listen 443 ssl;
    http2 on;
    server_name dcscan.io www.dcscan.io;

    ssl_certificate /etc/nginx/ssl/dcscan.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dcscan.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    # H8 (2026-07-25 audit): HSTS was missing here entirely.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # H8: this vhost had no rate limiting at all.
    limit_req zone=dcscan_api burst=30 nodelay;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /usr/share/nginx/html/dcscan;
    index index.html;

    # =========================================================================
    # CLEAN URLs - Hide .html extension
    # =========================================================================
    
    # Redirect .html URLs to clean URLs (301 permanent redirect for SEO)
    # Example: /strings.html -> /strings
    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # PNG-first iconUrls for wallet_addEthereumChain consumers of /network/config.
    location = /api/v1/network/config {
        proxy_pass http://host.docker.internal:3001/api/v1/network/config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering on;
        sub_filter 'https://dcscan.io/assets/logo.svg' 'https://dcscan.io/assets/logo.png';
        sub_filter_types *;
        sub_filter_once on;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
    }

    # ethereum-lists / ChainList icon CID (byte-identical 256x256 PNG).
    location ^~ /ipfs/ {
        default_type image/png;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # API Proxy - Route all /api/* requests to the DC Explorer backend
    location /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # H8: re-declared - this location already sets its own add_header
        # directives (CORS below), which suppresses the server-level HSTS.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Kickstarter-style project detail: /project and /project/<id> → project.html
    # Use ^~ so this wins over the SPA-style /index.html fallback in `location /`
    # (regex locations can lose to prefix matching depending on nginx version/order).
    location ^~ /project {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        # rewrite (not try_files) - never fall through to index.html
        rewrite ^ /project.html break;
    }

    # 2026-08-11 UX FIX: dynamic subpaths (/address/<addr>, /tx/<hash>, /token/<addr>,
    # /string/<id>, /agents/<id>, /tokens/<addr>, /blockchain/<seg>) MUST fall back to
    # the subpath's own SPA (e.g. /address/index.html), NEVER to the site homepage
    # /index.html. Prior behaviour of `try_files $uri $uri.html $uri/index.html $uri/
    # /index.html` served the ecosystem homepage for every deep-link share (CMC,
    # CoinGecko, Etherscan-style permalinks), so users pasting or clicking
    # `dcscan.io/address/0xCF88...` landed on the homepage rather than the address
    # detail view - masking real balances, labels, and holdings and confusing external
    # auto-linkers into treating the address as an Ethereum contract.
    # Each block uses `^~` prefix priority + a subpath-scoped `try_files` fallback.
    location ^~ /core    { try_files $uri $uri.html $uri/index.html /core/fat/index.html; }
    location ^~ /address { try_files $uri $uri.html $uri/index.html /address/index.html; }
    location ^~ /tx      { try_files $uri $uri.html $uri/index.html /tx/index.html; }
    location ^~ /token   { try_files $uri $uri.html $uri/index.html /token/index.html; }
    location ^~ /string  { try_files $uri $uri.html $uri/index.html /string/index.html; }
    location ^~ /agents  { try_files $uri $uri.html $uri/index.html /agents/index.html $uri /agents.html; }
    location ^~ /tokens  { try_files $uri $uri.html $uri/index.html /tokens/index.html /tokens.html; }
    location ^~ /blockchain { try_files $uri $uri.html $uri/index.html /blockchain/accounts.html; }

    # Serve clean URLs by trying: exact file, .html version, directory/index.html, fallback
    # Example: /strings -> tries /strings, /strings.html, /strings/index.html
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    # Static assets: JS/CSS revalidate every request (via ETag) so a fresh deploy
    # is picked up immediately by every returning visitor. If unchanged, nginx
    # returns 304 Not Modified (tiny response). No `?v=` cache-buster needed on
    # script tags. Fonts/images keep a long cache since they rarely change; when
    # they do, rename the file (or add ?v= only on that asset).
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}

# Explorer API - api.dcscan.io
server {
    listen 443 ssl;
    http2 on;
    server_name api.dcscan.io;

    ssl_certificate /etc/nginx/ssl/api.dcscan.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.dcscan.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # H8 (2026-07-25 audit): HSTS + rate limit - this vhost had neither.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    limit_req zone=dcscan_api burst=30 nodelay;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

    location / {
        if ($request_method = OPTIONS) {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        # Proxy all requests to DC Explorer backend
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Testnet Landing (Let's Encrypt) - Datachain Rope Testnet (chainId 271829, xFAT)
# 2026-08-30: replaced the mainnet-SPA passthrough with a dedicated testnet
# landing page + JSON-RPC pass-through to the testnet faucet backend, so this
# host stops leaking mainnet content while a full testnet explorer is being
# built.  Static UI lives in /usr/share/nginx/html/dcscan-testnet.
server {
    listen 443 ssl;
    http2 on;
    server_name testnet.dcscan.io;

    ssl_certificate /etc/nginx/ssl/testnet.dcscan.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/testnet.dcscan.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Never serve editor/deploy backups or hidden files.
    location ~ \\.(bak|old|orig|save)(-|\\.|$)|~$ { return 404; }
    location ~ /\\.(?!well-known) { return 404; }

    root /usr/share/nginx/html/dcscan-testnet;
    index index.html;

    # JSON-RPC pass-through so tools that expect an explorer host also see the
    # testnet chain.  Backend enforces method allowlist (read + eth_sendRaw).
    location = /rpc {
        limit_req zone=faucet_rpc burst=40 nodelay;
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        proxy_pass http://172.18.0.1:3100/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://172.18.0.1:3100/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Old paths a dev might try; keep them honest instead of a mainnet SPA.
    location ^~ /address { return 302 /; }
    location ^~ /tx      { return 302 /; }
    location ^~ /token   { return 302 /; }
    location ^~ /string  { return 302 /; }
    location ^~ /tokens  { return 302 /; }
    location ^~ /blockchain { return 302 /; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
