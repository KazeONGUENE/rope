# First-party icon gateway for wallet / registry CID resolution.
# Serves the ethereum-lists datachain icon CID as the live 256x256 PNG
# (byte-identical to Pinata + ipfs.io). Not an open recursive IPFS proxy.
#
# DNS A: ipfs.datachain.network -> new-blue (159.65.208.206)
# TLS: /etc/letsencrypt/live/ipfs.datachain.network (copied to /opt/datachain-rope/ssl/)

server {
    listen 80;
    server_name ipfs.datachain.network;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ipfs.datachain.network;

    ssl_certificate     /etc/nginx/ssl/ipfs.datachain.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ipfs.datachain.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Access-Control-Allow-Origin * always;
    add_header X-Content-Type-Options nosniff always;

    location = /ipfs/bafybeibfkitcey5cpevavib36dv2rxefszbpcxdibyjupizprhuadblccy {
        alias /usr/share/nginx/html/ipfs-cids/bafybeibfkitcey5cpevavib36dv2rxefszbpcxdibyjupizprhuadblccy.png;
        default_type image/png;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location = /ipfs/bafybeibfkitcey5cpevavib36dv2rxefszbpcxdibyjupizprhuadblccy/ {
        alias /usr/share/nginx/html/ipfs-cids/bafybeibfkitcey5cpevavib36dv2rxefszbpcxdibyjupizprhuadblccy.png;
        default_type image/png;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location = /ipfs/bafkreibljkgtx4wneclhsrey2czzjphltawsqvqyytwok7bp2txxu4uxxu {
        alias /usr/share/nginx/html/ipfs-cids/bafkreibljkgtx4wneclhsrey2czzjphltawsqvqyytwok7bp2txxu4uxxu.png;
        default_type image/png;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = / {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"service":"datachain-ipfs-gateway","paths":["/ipfs/bafybeibfkitcey5cpevavib36dv2rxefszbpcxdibyjupizprhuadblccy"],"https_logo":"https://dcscan.io/assets/logo.png"}';
    }

    location / {
        return 404;
    }
}
