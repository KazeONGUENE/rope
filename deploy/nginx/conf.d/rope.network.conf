# rope.network - Redirect to datachain.network

server {
    listen 80;
    server_name rope.network www.rope.network erpc.rope.network ws.rope.network;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rope.network www.rope.network;

    ssl_certificate /etc/nginx/ssl/rope.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rope.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://datachain.network$request_uri;
}

# RPC Endpoint - Proxies to rope-node (JSON-RPC)
server {
    listen 443 ssl;
    http2 on;
    server_name erpc.rope.network;

    ssl_certificate /etc/nginx/ssl/erpc.rope.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/erpc.rope.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # H8 (2026-07-25 audit): this legacy vhost had no HSTS and no rate
    # limit at all — same gap class as H2's missing V11 header-strip fix.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    limit_req zone=rpc burst=50 nodelay;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    location / {
        if ($request_method = OPTIONS) {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        # Proxy to rope-node JSON-RPC endpoint
        proxy_pass http://rope-node:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # V11 hot-fix (2026-07-25 audit finding H2 — this legacy vhost was
        # missed when the fix landed in datachain.network.conf on
        # 2026-06-12): strip any inbound copy of the internal-bypass
        # header so an internet-side caller through erpc.rope.network
        # can never forge it into a V11 destructive-method gate bypass.
        # See docs/SECURITY_AUDIT_2026-06-11.md and
        # docs/SECURITY_AUDIT_2026-07-25_FULL_WORKSPACE.md, rope_auth.rs.
        proxy_set_header X-Rope-Internal-Token "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# WebSocket Endpoint - Proxies to rope-node (WebSocket subscriptions)
server {
    listen 443 ssl;
    http2 on;
    server_name ws.rope.network;

    ssl_certificate /etc/nginx/ssl/ws.rope.network/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ws.rope.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # H8 (2026-07-25 audit): HSTS + handshake-level rate limit.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    limit_req zone=api burst=20 nodelay;

    location / {
        # Proxy to rope-node WebSocket endpoint
        proxy_pass http://rope-node:8546;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # V11 hot-fix (2026-07-25 audit finding H2): strip any inbound
        # internal-bypass header on the legacy ws.rope.network vhost too.
        proxy_set_header X-Rope-Internal-Token "";

        # WebSocket specific timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
