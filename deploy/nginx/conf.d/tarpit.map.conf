# CERBER R14 tarpit map.
#
# Populated by /opt/datachain-rope/cerber/bin/cerber-rpc-classify.mjs. The
# classifier writes one line per malicious IP (form: "1.2.3.4 malicious;") to
# /opt/datachain-rope/code/deploy/nginx/conf.d/malicious-ips.include on the
# host. That directory is bind-mounted read-only into the rope-nginx
# container at /etc/nginx/conf.d/, so nginx workers see the file at
# /etc/nginx/conf.d/malicious-ips.include.
#
# The .include extension is deliberate: nginx's default
# `include /etc/nginx/conf.d/*.conf;` glob (see nginx.conf) does NOT match
# .include files, so nothing is auto-loaded at the http{} scope. This file
# is ONLY pulled in below, inside the map{} block, where the "1.2.3.4
# malicious;" rows are valid map entries.
#
# The `default normal;` fallback lives here (not in the include) so the map
# still resolves cleanly when the include file is missing (fresh host,
# classifier hasn't run yet, or every malicious entry aged out).
#
# Requests from IPs flagged as `malicious` are routed to the local tarpit on
# 127.0.0.1:9099 where they receive a slow, plausible-but-wrong JSON-RPC
# reply. No retaliatory traffic is ever emitted from this host.

map $remote_addr $rope_tarpit_flag {
    default                        normal;
    include                        /etc/nginx/conf.d/malicious-ips.include;
}
