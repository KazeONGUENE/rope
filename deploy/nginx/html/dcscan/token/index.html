<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      As of 2026-06-04, the canonical surface for any contract / token /
      wallet is /address/:id. The address page detects DCR-20 contracts
      via /api/v1/tokens/:id and renders the token-specific overlay
      (logo, market cards, Holders / DEX Trades / Analytics tabs) on top
      of the standard address layout, so /token/:id and /address/:id are
      visually identical and both leverage the address page's String &
      Knots / Transactions / Internal Txns / Token Transfers / Contract /
      Events / Assets / Info tabs. We keep /token/:id as a stable URL
      (other surfaces still link there) by redirecting it to /address/:id.
    -->
    <meta http-equiv="refresh" content="0; url=/address/__addr__">
    <script>
        (function () {
            var parts = window.location.pathname.split('/').filter(Boolean);
            // /token/:id  → parts = ['token', ':id']
            // /token/:id/<tab> → parts = ['token', ':id', '<tab>']
            if (parts.length >= 2 && parts[0] === 'token') {
                var target = '/address/' + parts.slice(1).join('/') +
                    (window.location.search || '') + (window.location.hash || '');
                window.location.replace(target);
            } else {
                window.location.replace('/tokens');
            }
        })();
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 40px; text-align: center; color: #475569; }
        a { color: #1d4ed8; }
    </style>
</head>
<body>
    <p>Redirecting to the unified address view…</p>
    <p><a id="manual-link" href="/tokens">Browse all tokens</a></p>
    <script src="/js/dcscan-wallet.js?v=20260707b" defer></script>
</body>
</html>
