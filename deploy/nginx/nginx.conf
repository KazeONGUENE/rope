load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
# 2026-08-04 tune: raise per-worker fd soft limit so worker_connections 4096
# is not silently capped at 1024 by the container ulimit. Hard limit inside
# the rope-nginx container is 524288 so 65535 is well within reach.
worker_rlimit_nofile 131072;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 2026-08-04 tune (tanastok mesh-probe 5xx pattern): bump from 1024 to
    # 4096. Fleet keepalive pool alone can hold 4x64 = 256 upstream sockets
    # plus client-side keepalives; 1024 was snug during peer-probe bursts
    # and can silently drop accepts under coincident RPC + mesh load.
    # 2026-08-25: one worker hit the 4096 cap (4111 fds) and RST new TLS
    # handshakes. ChainList / MetaMask then reported every RPC down while
    # existing keepalives still returned 200. 16384 leaves headroom without
    # exceeding the container nofile ulimit (65535).
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 2026-08-04 tune: enrich access-log with upstream diagnostics so future
    # 502/503 investigations don't require SSH + docker-log spelunking. We
    # can now tell which backend answered, how long the connect and read
    # phases took, and whether nginx failed over.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" ua_len=$request_length '
                    'rt=$request_time uc=$upstream_connect_time '
                    'ur=$upstream_response_time us=$upstream_status '
                    'ua=$upstream_addr uct=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 2026-08-04 tune (tanastok handover): rate-limit hits now return 429
    # (canonical "Too Many Requests") instead of the default 503 so that
    # mesh peers stop flagging burst-throttled probes as unhealthy edge.
    # 503 is reserved for actual upstream failure (see /healthz below).
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=rpc:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=dcscan_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=dcscan_pages:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=faucet_api:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=faucet_rpc:10m rate=20r/s;

    # Connection limits
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Request body limits
    client_max_body_size 2g;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 2026-08-04 tune: enable TCP keepalive on upstream sockets so nginx
    # detects a half-open socket to Reth within OS defaults (typically
    # ~2h without this; ~75s with it) instead of only failing when it
    # tries to write a new request. Cuts the window where a stale
    # upstream socket produces a 502 during a mesh-probe burst.
    proxy_socket_keepalive on;

    include /etc/nginx/conf.d/*.conf;
}
