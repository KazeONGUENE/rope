# Datachain Rope testnet - port 80 handler.
#
# Serves /.well-known/acme-challenge/ from the shared webroot so
# `certbot --nginx` (or `certbot certonly --webroot`) can renew certs
# for both hostnames without any nginx interruption. Every other
# request on port 80 is 301d to https.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name testnet.erpc.datachain.network faucet.datachain.network _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        if ($host = "testnet.erpc.datachain.network") { return 301 https://$host$request_uri; }
        if ($host = "faucet.datachain.network")       { return 301 https://$host$request_uri; }
        return 444;
    }
}
