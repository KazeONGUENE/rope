# Datachain Rope testnet faucet edge.
#
#   faucet.datachain.network/           --TLS-->  static SPA in /var/www/faucet
#   faucet.datachain.network/api/drip   --TLS-->  127.0.0.1:3100/api/drip
#   faucet.datachain.network/api/status --TLS-->  127.0.0.1:3100/api/status
#   faucet.datachain.network/healthz    --TLS-->  127.0.0.1:3100/healthz
#   faucet.datachain.network/rpc        --TLS-->  127.0.0.1:3100/rpc
#                                                 (32-method allowlist
#                                                  inside server.mjs,
#                                                  then upstream to
#                                                  the rope-testnet-node
#                                                  facade at :8545)

limit_req_zone $binary_remote_addr zone=testnet_faucet:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=testnet_faucet_drip:10m rate=1r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faucet.datachain.network;

    ssl_certificate     /etc/nginx/ssl-placeholder/placeholder.crt;
    ssl_certificate_key /etc/nginx/ssl-placeholder/placeholder.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/faucet;
    index index.html;

    client_max_body_size 32k;
    keepalive_timeout    65s;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy  "default-src \'self\'; script-src \'self\' \'unsafe-inline\'; style-src \'self\' \'unsafe-inline\'; connect-src \'self\' https://faucet.datachain.network https://testnet.erpc.datachain.network https://testnet.dcscan.io; img-src \'self\' data:" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:3100/healthz;
        proxy_read_timeout 5s;
    }

    location = /api/status {
        add_header Access-Control-Allow-Origin "*" always;
        limit_req zone=testnet_faucet burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/drip {
        # Extra strict: 1 drip / IP / minute at the nginx layer.
        # server.mjs still enforces the canonical 3 / IP / day.
        limit_req zone=testnet_faucet_drip burst=3 nodelay;
        limit_req_status 429;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type" always;
            return 204;
        }

        proxy_pass http://127.0.0.1:3100/api/drip;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /rpc {
        add_header Access-Control-Allow-Origin "*" always;
        limit_req zone=testnet_faucet burst=30 nodelay;
        proxy_pass http://127.0.0.1:3100/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
