# Datachain Rope testnet public JSON-RPC edge.
#
#   testnet.erpc.datachain.network  --TLS-->  nginx (this host)
#                                             |
#                                             v
#                                       127.0.0.1:8545
#                                       rope-testnet-node.service
#                                       (Phase-1 destructive-RPC gate
#                                        + Phase-2 signed-write gate,
#                                        chainId 271829 domain tag)
#                                             |
#                                             v
#                                       127.0.0.1:8595
#                                       rope-testnet-engine.service
#                                       (Reth --dev block-time 3s)
#
# The facade denies destructive rope_* methods with -32401 when
# X-Forwarded-For is present (i.e. the request came through nginx),
# and accepts them when accompanied by a Phase-2 signature envelope.
# Read methods (eth_*, txpool_*, web3_*, net_*) pass through freely.

# Rate limit: 60 req/s per IP with burst 120. Testnet is a dev tool;
# we cap noisy scanners but not honest wallet quorum reads.
limit_req_zone $binary_remote_addr zone=testnet_erpc:10m rate=60r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testnet.erpc.datachain.network;

    # Placeholder cert until first cert-issue after DNS flip.
    # `certbot --nginx -d testnet.erpc.datachain.network` will rewrite
    # these two lines to point at /etc/letsencrypt/live/....
    ssl_certificate     /etc/nginx/ssl-placeholder/placeholder.crt;
    ssl_certificate_key /etc/nginx/ssl-placeholder/placeholder.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cap requests + tunables
    client_max_body_size    256k;
    client_body_buffer_size 16k;
    keepalive_timeout       65s;

    # Security headers (RPC endpoint - no HTML rendered)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS for browser wallets (MetaMask, Frame, Rabby, etc.).
    # Preflight is handled here; the actual response CORS headers are
    # emitted by the upstream (rope-testnet-node passes them through
    # if configured, but we add them defensively).
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type, x-requested-with" always;

    location = / {
        # OPTIONS preflight fast path
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-requested-with" always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        limit_req zone=testnet_erpc burst=120 nodelay;

        proxy_pass         http://127.0.0.1:8545/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Health probe (public, cheap, no upstream call)
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else -> 404 (do NOT expose /admin, /metrics, /ws etc.)
    location / {
        return 404;
    }
}
