# /etc/sysctl.d/99-rope-sealer.conf
#
# A2 kernel tuning for the Datachain Rope sealer host (BLUE).
#
# Companion to `handover-blue-never-hangdown-alternatives-2026-08-23.mdc`
# menu item A2 and to the MTBF postmortem (memory-pressure / swap-thrash
# diagnosis, `docs/MTBF_REGRESSION_POSTMORTEM_AND_MITIGATION_MENU_2026-08-23.md`).
#
# **Deployment classification: SAFE-TO-APPLY on the currently-wedging 8 GB
# BLUE.** Every value here reduces memory pressure or reduces swap usage.
# None of them cause an immediate OOM.
#
# The dangerous companion setting `MemorySwapMax=0` is intentionally NOT
# in this file. It lives in the systemd drop-in
# `deploy/systemd/datachain-rope.service.d/71-memory-swap-post-upgrade.conf`
# and MUST NOT be applied until after the 8 -> 16 GB VPS upgrade (A3),
# because BLUE currently uses ~5.2 GB of swap and taking that away in one
# step would push rope-node past its cgroup limit and trigger SIGKILL.
#
# Apply order (operator security-cat protocol):
#   1. Copy this file to /etc/sysctl.d/99-rope-sealer.conf on rope-vps.
#   2. sudo sysctl -p /etc/sysctl.d/99-rope-sealer.conf
#   3. Verify with: sysctl vm.swappiness vm.dirty_ratio vm.min_free_kbytes
#   4. Watch `vmstat 5` for 2 minutes - `si/so` should trend down and
#      `wa` should drop within one dirty-writeback cycle.
#
# Rollback: `sudo rm /etc/sysctl.d/99-rope-sealer.conf && sudo sysctl -p`
# (defaults on Ubuntu 24.04 are the kernel-shipped values, no explicit
# reset needed for the parameters set here.)

# ---------------------------------------------------------------------
# Swap use: only when the kernel is truly out of options.
# ---------------------------------------------------------------------
# Default 60 aggressively swaps clean anonymous pages out well before the
# system is under pressure. On a sealer that touches its working set
# every second (RocksDB LSM compaction, StringLattice head guard,
# fleet-status writer), any swapped anonymous page eventually needs to be
# paged back in, and each pagein is a synchronous disk read that blocks
# the LamportClock mutex path (see quipu-canon-v2-roadmap-5m-tps).
#
# 1 (not 0) leaves the OOM killer a valid last resort: setting 0 disables
# swap for anonymous pages entirely, which on this box with 5.2 GB
# already resident in swap would trap those pages in swap forever
# because they can't be re-read on demand.
vm.swappiness = 1

# ---------------------------------------------------------------------
# Dirty writeback: keep more headroom, flush more often.
# ---------------------------------------------------------------------
# Default 20 / 10 lets up to 20% of RAM (~1.5 GB on this box) accumulate
# as unflushed dirty pages before forcing a foreground writeback. The
# resulting write burst can stall the RocksDB WAL for hundreds of
# milliseconds - long enough to trip the ghost-reclaim grace window
# and (before Tier E) to trigger a HEAL_ISSUED restart.
#
# 5 / 2 = start background writeback at ~150 MB dirty and force
# foreground writeback at ~375 MB. Smaller, more frequent flushes,
# smoother steady-state I/O.
vm.dirty_ratio = 5
vm.dirty_background_ratio = 2

# ---------------------------------------------------------------------
# Reserve pool: enough memory to always accept a critical allocation.
# ---------------------------------------------------------------------
# Default (67584 = ~66 MB) is calibrated for desktops with light
# workloads. Under sustained memory pressure on this box, the kernel
# has been observed to fail non-atomic allocations in the network stack
# (TCP retransmit backlog, epoll bookkeeping) before invoking the OOM
# killer, which manifests as "connection reset by peer" on the loopback
# probe used by both the external HA script and the in-process
# self_watchdog. The wedges look like the RPC accept-loop is stuck when
# in fact the kernel is refusing to allocate the receive buffer.
#
# 524288 KB = 512 MB reserved. Costs 512 MB of usable RAM but guarantees
# the network + syscall paths never contend for the last few pages.
vm.min_free_kbytes = 524288

# ---------------------------------------------------------------------
# Overcommit: strict accounting.
# ---------------------------------------------------------------------
# Default 0 (heuristic) lets malloc() return non-NULL for allocations
# that the kernel cannot actually back with pages + swap, deferring the
# failure to first-touch (SIGSEGV, or worse, an OOM kill of a random
# unrelated process). On a sealer that must not silently die, this is
# unacceptable.
#
# mode 2 (strict) makes the kernel refuse any allocation beyond
# `swap + overcommit_ratio * RAM / 100`. With ratio=80, the ceiling on
# this 8 GB / 15 GB-swap box is `15 + 0.80 * 8 = 21.4 GB`. After the
# 16 GB upgrade the ceiling rises to `15 + 0.80 * 16 = 27.8 GB`.
#
# rope-node RSS steady-state is ~2 GB (post-lazy-rehydrate), so this
# ceiling is 10x headroom. It matters because it means a runaway process
# fails at `mmap()` return time with a clean ENOMEM that the process can
# log and exit gracefully, rather than dying half-way through a
# RocksDB write with the WAL in an inconsistent state.
vm.overcommit_memory = 2
vm.overcommit_ratio = 80

# ---------------------------------------------------------------------
# NUMA / mm tuning: not applicable on this box.
# ---------------------------------------------------------------------
# rope-vps is a single-socket Xen VM. NUMA parameters would do nothing
# except confuse the operator during a post-incident review; they are
# deliberately omitted.
