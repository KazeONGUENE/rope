[Service]
# Quipu Canon v2.0 Phase 2.B - parallel RocksDB writer + deferred blob
# store outside head_guard.
#
# Enables the 8-way sharded persistence backend
# (crates/rope-storage/src/rocksdb_persistence_p2b.rs). Same on-disk
# format as the legacy single-flusher backend, so a rollback is a
# one-line env-remove + restart (no data migration).
#
# See:
#  - datachain-rope/.cursor/rules/handover-from-dcswap-dcscan-address-parity-fixes-2026-08-11.mdc
#    section 22 for the full design + rollout playbook.
#  - datachain-rope/.cursor/rules/quipu-canon-v2-roadmap-5m-tps.mdc
#    for the broader Phase 2 context.
#
# Rollout gate:
#  1. Deploy on BLUE only.
#  2. Soak >=24h. Watch:
#       - `rope_latticeMetrics` head_guard_hold histogram (mean +
#         p99 should drop vs the pre-P2B baseline captured at
#         datachain-rope/deploy/p2b-baseline/pre-p2b-*).
#       - `journalctl -u datachain-rope.service` for any panic or
#         RocksBackend error line.
#       - `erpc-fleet-ha.log` for any new HEAL_ISSUED spikes.
#  3. If clean for 24h + rope_latticeMetrics shows the head_guard_hold
#     tail moving left, roll to GREEN, DO-rpc-1, DO-rpc-2 in that
#     order with the same soak between each.
#
# Rollback (single command, byte-compatible on-disk state):
#     sudo rm /etc/systemd/system/datachain-rope.service.d/30-ledger-p2b.conf
#     sudo systemctl daemon-reload
#     sudo systemctl restart datachain-rope.service
Environment=ROPE_LEDGER_P2B=1
