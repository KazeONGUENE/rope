[Service]
# P1 self-watchdog (§17.5 #3): internal loopback RPC probe independent of HA cap.
#
# Detects stalled rope-node processes (rope-node accepts TCP but does not answer
# eth_blockNumber within STALL_SECS) and, if SUICIDE=1, exits the process so
# systemd Restart=always picks up the slack.
#
# Full design + rollout in:
#   - datachain-rope/.cursor/rules/handover-from-dcswap-dcscan-address-parity-fixes-2026-08-11.mdc
#     section 23.1 (spec) and section 24.1 (BLUE deploy record).
#
# OBSERVE MODE: SUICIDE=0 -> state file only, no self-restart.
# Flip to SUICIDE=1 after 48h clean observation window.
#
# State file: <data_dir>/self-watchdog.json (atomic write, updated every INTERVAL_SECS).
#
# Rollback (single command):
#     sudo rm /etc/systemd/system/datachain-rope.service.d/40-self-watchdog.conf
#     sudo systemctl daemon-reload
#     sudo systemctl restart datachain-rope.service
Environment=ROPE_SELF_WATCHDOG_ENABLED=1
Environment=ROPE_SELF_WATCHDOG_SUICIDE=0
Environment=ROPE_SELF_WATCHDOG_INTERVAL_SECS=10
Environment=ROPE_SELF_WATCHDOG_TIMEOUT_SECS=5
Environment=ROPE_SELF_WATCHDOG_STARTUP_GRACE_SECS=300
Environment=ROPE_SELF_WATCHDOG_STALL_SECS=60
