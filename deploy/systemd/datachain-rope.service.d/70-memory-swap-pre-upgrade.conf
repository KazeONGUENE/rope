# /etc/systemd/system/datachain-rope.service.d/70-memory-swap-pre-upgrade.conf
#
# A2 systemd cgroup tuning for the Datachain Rope sealer - **PRE-UPGRADE
# variant** (safe to apply on the currently-wedging 8 GB BLUE).
#
# Companion to `handover-blue-never-hangdown-alternatives-2026-08-23.mdc`
# menu item A2, and to the existing drop-in stack on rope-vps:
#   10-memory-and-restart.conf  MemoryHigh=5632M / MemoryMax=6656M
#   20-bootstrap.conf           Environment=ROPE_BOOTSTRAP_*
#   30-emergency-timeout.conf   TimeoutStartSec / TimeoutStopSec
#   30-ledger-p2b.conf          Environment=ROPE_LEDGER_P2B=1
#   40-fd-limit.conf            LimitNOFILE=1048576
#   40-self-watchdog.conf       Environment=ROPE_SELF_WATCHDOG_*=1
#   50-phase2-signed-destructive.conf   Environment=ROPE_PHASE2_*=1
#   60-lazy-rehydrate.conf      Environment=ROPE_LAZY_REHYDRATE=1
#
# This drop-in adds ONLY parameters that are safe on the 8 GB VPS
# right now. It does NOT set MemorySwapMax (which would OOM-kill the
# process on a box currently using 5.2 GB of swap). It does NOT raise
# MemoryHigh above the value in 10-memory-and-restart.conf (that raise
# lives in the post-upgrade companion drop-in, applied only after the
# VPS is on 16 GB).
#
# Deployment classification: SAFE-TO-APPLY on 8 GB BLUE.
#
# Apply order (operator security-cat protocol):
#   1. Copy to /etc/systemd/system/datachain-rope.service.d/70-memory-swap-pre-upgrade.conf
#   2. sudo systemctl daemon-reload
#   3. sudo systemctl restart datachain-rope.service   # ONLY during a
#      planned window; the P2B rehydrate can take ~4 min.
#   4. Verify: systemctl show datachain-rope.service --property MemoryLow,MemoryPressureLevel
#   5. Watch `journalctl -u datachain-rope.service -f` for one HA tick.
#
# Rollback: `sudo rm /etc/systemd/system/datachain-rope.service.d/70-memory-swap-pre-upgrade.conf`
# then daemon-reload + restart.

[Service]

# ---------------------------------------------------------------------
# MemoryLow: soft reservation, not a hard cap.
# ---------------------------------------------------------------------
# `MemoryLow` tells the kernel: "if there is memory pressure, prefer to
# reclaim from other cgroups first, up to this amount for this cgroup."
# On a shared box like BLUE (which also runs ipfs, semantic-agent,
# nginx, cerber-mesh, etc.), this ensures the sealer keeps its working
# set resident even when a co-tenant transiently spikes.
#
# 2 GB is chosen to cover:
#   * RocksDB block cache (default ~256 MB) + WAL buffers
#   * StringLattice per-wallet head guard cache (~200 MB steady-state)
#   * Fleet-status writer + HTTP RPC accept loop (~50 MB)
#   * Phase-2 signed-destructive nonce store (~100 MB steady-state)
#   * ~1.4 GB working slack for burst-y compaction and inbound RPC
#
# This does NOT prevent the sealer from using more if it needs to; it
# only guarantees the first 2 GB is protected from cross-cgroup reclaim.
MemoryLow=2G

# ---------------------------------------------------------------------
# IOSchedulingClass / IOWeight: prioritise sealer I/O over co-tenants.
# ---------------------------------------------------------------------
# ipfs pinning and semantic-agent tantivy commits are both write-heavy.
# When they compete with the sealer for disk bandwidth, the RocksDB WAL
# fsync latency spikes to hundreds of ms, which propagates directly to
# LamportClock stall and (before Tier E) to HEAL_ISSUED restarts.
#
# Class 1 (realtime) is too aggressive - it can starve journald.
# Class 2 (best-effort) with weight 500 (default 100, max 1000) is
# enough to win against the two workload-heavy co-tenants without
# starving anything else.
IOSchedulingClass=2
IOSchedulingPriority=2
IOWeight=500

# ---------------------------------------------------------------------
# Nice / CPUWeight: same principle for CPU.
# ---------------------------------------------------------------------
# Sealer must respond to inbound RPC within the 3-second HA-tick
# window. Bump its CPU weight above the systemd default of 100.
CPUWeight=500

# ---------------------------------------------------------------------
# OOMPolicy: kill this service on its own, not the cgroup.
# ---------------------------------------------------------------------
# Default `continue` means the OOM killer chooses within the cgroup,
# which (because rope-node forks a P2B RocksDB writer thread) can kill
# the writer without the parent noticing. `kill` makes the OOM killer
# kill the whole service unit, which systemd then restarts cleanly.
#
# This is a defensive setting - with MemoryLow above and the existing
# MemoryMax=6656M in 10-memory-and-restart.conf, we shouldn't actually
# reach OOM, but if we do, we want a clean restart, not a zombie state.
OOMPolicy=kill

# ---------------------------------------------------------------------
# Not set here (deferred to 71-memory-swap-post-upgrade.conf):
#   MemorySwapMax=0     -- catastrophic while 5.2 GB of swap is used
#   MemoryHigh=13G      -- overshoots current MemoryMax=6656M
#   MemoryMax=15G       -- overshoots physical RAM on 8 GB VPS
#
# These belong in the post-A3 drop-in. Applying them before the VPS
# is on 16 GB would either OOM-kill rope-node on next start or would
# be silently clamped by the kernel and mislead the operator into
# thinking they had headroom that didn't exist.
# ---------------------------------------------------------------------
