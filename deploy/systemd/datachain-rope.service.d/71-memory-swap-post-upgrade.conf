# /etc/systemd/system/datachain-rope.service.d/71-memory-swap-post-upgrade.conf
#
# A2 systemd cgroup tuning for the Datachain Rope sealer - **POST-UPGRADE
# variant** (safe ONLY after the 8 GB -> 16 GB VPS resize completes and
# the box has been up for at least one clean rope-node cycle).
#
# Companion to `handover-blue-never-hangdown-alternatives-2026-08-23.mdc`
# menu item A2 + `docs/ROPE_VPS_MEMORY_UPGRADE_RUNBOOK_2026-08-23.md` §3.
#
# **Deployment classification: DANGEROUS ON 8 GB. SAFE ONLY AFTER A3.**
#
# Do NOT apply this drop-in until:
#   1. Gandi has resized the VM to 16 GB RAM.
#   2. `free -h` shows total >= 15 GB and swap Used <= 100 MB.
#   3. rope-node has been running for at least 5 minutes and its RSS
#      has settled (usually ~2 GB post-P2B-rehydrate).
#   4. The pre-upgrade drop-in (70-memory-swap-pre-upgrade.conf) has
#      been applied cleanly for at least one HA-tick cycle.
#
# Applying this file before those conditions are met will trigger a
# SIGKILL of rope-node on next restart, because MemorySwapMax=0 makes
# any resident swapped page a hard cgroup-max violation, and MemoryMax
# will clip below current RSS.
#
# Apply order (operator security-cat protocol):
#   1. Verify the four conditions above.
#   2. Copy to /etc/systemd/system/datachain-rope.service.d/71-memory-swap-post-upgrade.conf
#   3. sudo systemctl daemon-reload
#   4. sudo systemctl restart datachain-rope.service   # planned window
#   5. Verify:
#        systemctl show datachain-rope.service \
#          --property MemorySwapMax,MemoryHigh,MemoryMax,MemoryLow
#      All four must be non-zero. MemorySwapMax must be 0 (which
#      systemd reports as "MemorySwapMax=0" and the kernel enforces).
#   6. Watch `vmstat 5` for 5 minutes - `si/so` must stay at 0.
#
# Rollback: `sudo rm /etc/systemd/system/datachain-rope.service.d/71-memory-swap-post-upgrade.conf`
# then daemon-reload + restart. This reverts to the pre-upgrade
# behaviour where the sealer may swap.

[Service]

# ---------------------------------------------------------------------
# MemorySwapMax=0: hard prohibition on swap use.
# ---------------------------------------------------------------------
# After A3, the sealer no longer needs swap (16 GB physical is 8x its
# steady-state RSS of ~2 GB). Setting swap max to 0 in the cgroup makes
# the kernel refuse to swap any of this service's pages out, which
# eliminates the pagein-under-lock stall class that was the direct
# cause of BLUE's MTBF regression from ~30 min to ~7 min.
#
# The kernel will still refuse the allocation and let systemd restart
# the service if RSS ever hits MemoryMax, which is a clean failure mode.
MemorySwapMax=0

# ---------------------------------------------------------------------
# MemoryHigh=13G: soft cap with throttle.
# ---------------------------------------------------------------------
# Overrides `MemoryHigh=5632M` from 10-memory-and-restart.conf (that
# file's value is a workaround for the 8 GB era; it should be removed
# from the tree in a follow-up commit, but leaving it in place with a
# higher override here is safe - systemd merges drop-ins in name-sort
# order, so 70- and 71- both override 10-).
#
# 13 GB = physical RAM (16) - MemoryLow (2, from 70-) - 1 GB kernel /
# co-tenant slack. The kernel throttles the cgroup once it reaches
# 13 GB but does not kill it, giving the process a chance to drop
# caches and get back under before hitting MemoryMax.
MemoryHigh=13G

# ---------------------------------------------------------------------
# MemoryMax=15G: hard cap with SIGKILL.
# ---------------------------------------------------------------------
# 15 GB (not the full 16 GB) leaves 1 GB for the kernel, journald,
# nginx, and the reduced co-tenant footprint post-A1. If rope-node ever
# tries to allocate past this, the OOM killer kills it and systemd
# restarts it - which is what we want, because reaching 15 GB indicates
# either a leak or an out-of-spec workload, and either way the P2B
# RocksDB rehydrate on restart is faster and safer than a runaway.
MemoryMax=15G

# ---------------------------------------------------------------------
# TasksMax: prevent runaway thread creation.
# ---------------------------------------------------------------------
# Default is 4915 on Ubuntu 24.04. rope-node steady-state is ~180
# threads (tokio runtime + P2B writer + self-watchdog + HTTP RPC pool).
# Cap at 2048 to catch a runaway spawn early - a leak in the RPC
# accept loop was suspected but not confirmed during the 2026-08-16
# investigation; this cap makes any recurrence obvious in journald.
TasksMax=2048

# ---------------------------------------------------------------------
# What we deliberately did NOT change from the pre-upgrade drop-in:
#   MemoryLow=2G          -- still correct; reservation not cap
#   IOSchedulingClass=2   -- co-tenant contention shrinks after A1
#                            but doesn't disappear (nginx + cerber)
#   CPUWeight=500         -- same reasoning
#   OOMPolicy=kill        -- still correct
# ---------------------------------------------------------------------
