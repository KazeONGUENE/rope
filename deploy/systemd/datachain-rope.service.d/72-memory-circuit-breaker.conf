# /etc/systemd/system/datachain-rope.service.d/72-memory-circuit-breaker.conf
#
# B2 enablement drop-in for the in-process memory circuit breaker in
# rope-node's self_watchdog module.
#
# Companion to:
#   crates/rope-node/src/self_watchdog.rs  (implementation)
#   handover-p0-p1-p2-sequence-2026-08-23.mdc  (P1-B2 scope)
#
# The B2 circuit breaker reads /proc/self/status VmRSS and the cgroup
# memory.pressure PSI (full avg60 x 100), and if either exceeds its
# threshold for a sustained window (default 90s), calls
# std::process::exit(1) so systemd restarts the unit before the OOM
# killer fires.
#
# **Deployment classification: DANGEROUS ON 8 GB. SAFE ONLY AFTER A3
# AND 71-memory-swap-post-upgrade.conf ARE BOTH APPLIED.**
#
# Why the ordering is strict:
#   * On today's 8 GB BLUE, VmRSS routinely climbs to 3.5-4.5 GB during
#     the P2B rehydrate window and cgroup memory.pressure full avg60
#     exceeds 5000 (=50%) during swap-thrash episodes. If B2 were
#     enabled right now with the default thresholds, it would trip the
#     circuit within 90s of every restart and put the service into a
#     restart-loop that only the operator can break.
#   * On a 16 GB VPS with MemorySwapMax=0 (post-71), steady-state RSS
#     is ~2 GB and memory.pressure is < 100 (=1%). The default
#     thresholds (RSS 6 GB, PSI 5000, sustained 90s) are then correctly
#     calibrated: they trip only when the sealer is genuinely running
#     out of memory, not when it is merely doing normal I/O.
#
# Apply order (operator security-cat protocol):
#   1. Confirm A3 (VPS at 16 GB) and 71-memory-swap-post-upgrade.conf
#      have been applied cleanly and the service has been up for
#      at least 15 minutes.
#   2. Confirm `cat /proc/$(systemctl show -p MainPID --value \
#      datachain-rope.service)/status | grep -E 'VmRSS|VmSwap'` shows
#      RSS < 3 GB and Swap = 0 kB.
#   3. Copy to /etc/systemd/system/datachain-rope.service.d/72-memory-circuit-breaker.conf
#   4. sudo systemctl daemon-reload
#   5. sudo systemctl restart datachain-rope.service   # planned window
#   6. Verify: journalctl -u datachain-rope.service -f | grep -i circuit
#      Should show "memory circuit breaker armed" on startup with the
#      thresholds echoed back.
#   7. Watch for 24 hours. If the circuit ever trips, journalctl will
#      show "memory circuit breaker TRIPPED" with the reason (rss vs
#      psi) and the sustained duration.
#
# Rollback: `sudo rm /etc/systemd/system/datachain-rope.service.d/72-memory-circuit-breaker.conf`
# then daemon-reload + restart. The self_watchdog reverts to observe-
# only mode; memory metrics are still logged to
# /var/lib/datachain-rope/self-watchdog.json but no process action is
# taken on breach.

[Service]

# ---------------------------------------------------------------------
# Enable the B2 memory-pressure circuit breaker.
# ---------------------------------------------------------------------
# The self_watchdog module reads this env var on startup. When 0 or
# unset (default), the memory probe still populates
# self-watchdog.json for observability but never calls exit(). When 1,
# a sustained breach triggers std::process::exit(1) after
# `sustained` seconds.
Environment=ROPE_MEMORY_CIRCUIT_ENABLED=1

# ---------------------------------------------------------------------
# RSS hard ceiling (MB).
# ---------------------------------------------------------------------
# Default in the code is 6144 (6 GB). Override here to 12 GB to match
# the 15 GB MemoryMax from 71-post-upgrade, minus a 3 GB safety margin
# so the circuit trips BEFORE the cgroup SIGKILL fires. This gives
# rope-node a clean graceful-exit path (drain WAL, flush RocksDB,
# checkpoint self-watchdog state) that the kernel OOM path does not.
Environment=ROPE_MEMORY_CIRCUIT_RSS_HARD_MB=12288

# ---------------------------------------------------------------------
# PSI full avg60 threshold (0.0 - 100.0, sent as x100 int internally).
# ---------------------------------------------------------------------
# Default in the code is 5000 (=50%). Keep default: 50% means the
# cgroup was fully stalled on memory for at least 30 out of the last
# 60 seconds. On a 16 GB / MemorySwapMax=0 box this is a clear signal
# of a genuine memory leak or an adversarial workload, not a normal
# operational spike.
Environment=ROPE_MEMORY_CIRCUIT_PSI_FULL_AVG60_THRESHOLD=50.0

# ---------------------------------------------------------------------
# Sustained duration (seconds).
# ---------------------------------------------------------------------
# Default in the code is 90. Both RSS and PSI must breach continuously
# for this long before the circuit trips. Chosen to be shorter than
# the systemd Restart backoff (defaults to 5s min, our restart cadence
# is ~30s after Tier E) but long enough to survive a single-shot
# GC/compaction spike without a false trip.
Environment=ROPE_MEMORY_CIRCUIT_SUSTAINED_SECS=90
