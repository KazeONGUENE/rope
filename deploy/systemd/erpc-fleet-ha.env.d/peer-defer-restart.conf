# Peer-aware restart deferral + loopback probe URL (2026-09-01).
# Loaded by erpc-fleet-ha.service via EnvironmentFile drop-in directory.

ROPE_HA_PEER_DEFER_RESTART=1
ROPE_HA_PEER_DEFER_FAIL_THRESHOLD=20
ROPE_HA_PEER_DEFER_MAX_SECS=900

# Sync-thread probe (GET /v1/tip) — bypasses saturated JSON-RPC :8545 queue.
ROPE_BLUE_PROBE_URL=http://127.0.0.1:8544/v1/tip
ROPE_SELF_WATCHDOG_PROBE_URL=http://127.0.0.1:8544/v1/tip
