# systemd drop-in for erpc-fleet-ha.service
#
# Purpose: raise ROPE_HA_MAX_RESTARTS_PER_HOUR from 4 (default) to 8.
#
# Rationale: during the 2026-08-11 wedge storm the HA cap of 4/hr was
# hit inside a single 90-min window and left BLUE marked
# out_of_service (`restart_cap:rpc_probe_fail`) until an operator
# manually reset /var/lib/datachain-rope/fleet/ha.state. The
# Phase 1.6.β lattice fix (§18 of handover-from-dcswap-...-2026-08-11)
# should make wedges much rarer, but if one does happen the cap
# should give self-heal more headroom before demanding a human.
#
# 8/hr is still a hard cap that stops runaway crash-loops (~7.5-min
# average cycle would exhaust it, which is what runaway looks like).
#
# Rollback: `sudo rm /etc/systemd/system/erpc-fleet-ha.service.d/10-max-restarts.conf && sudo systemctl daemon-reload`
# (defaults back to 4/hr from the script itself).
#
# Deployed: 2026-08-12 (Phase B of Phase 1.6.β rollout)

[Service]
Environment=ROPE_HA_MAX_RESTARTS_PER_HOUR=8
