# systemd drop-in for erpc-fleet-ha.service
#
# Purpose: raise ROPE_HA_SELF_HEAL_DEADLINE_S from 180s (3 min) to 900s
# (15 min).
#
# Rationale: during the 2026-08-11/12 wedge storm the underlying
# `rope-node` cycles roughly every 6-9 min under load. Each cycle looks
# like: wedge (writer -> unhealthy) -> HA restart (~90s) -> service
# restart (~30s) -> 5-min startup grace (writer=starting counts as
# non-healthy). Total time before writer.status flips back to healthy:
# 6-7 min per cycle.
#
# With the previous 180s deadline, `self_heal.escalate_to_cerber` would
# flip to true on EVERY cycle even though the system was self-healing
# correctly, causing DCSwap CERBER R12 alert fatigue for what is
# fundamentally normal operation of a known-degraded node.
#
# The 900s (15 min) deadline preserves the honest signal:
#   - Single wedge + self-heal (~7 min): escalate stays false -> no page.
#   - Two consecutive wedges without recovery (>=15 min unhealthy):
#     escalate=true -> real page. This is what we actually want to
#     wake someone up for.
#
# This is a symptom-mitigation drop-in, not a root fix. The real fix is
# Phase 2.B (parallel RocksDB writers + deferred blob store outside
# head_guard) which will eliminate the wedge entirely. Until then, this
# reduces alert noise without hiding real outages.
#
# Rollback:
#   sudo rm /etc/systemd/system/erpc-fleet-ha.service.d/20-self-heal-deadline.conf && sudo systemctl daemon-reload
#
# Deployed: 2026-08-12 (Phase B.2 of Phase 1.6.β rollout)
# Reversible: yes, single-file removal + daemon-reload.

[Service]
Environment=ROPE_HA_SELF_HEAL_DEADLINE_S=900
